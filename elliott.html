<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111d">
  <title>Elliott Lab · Market Hunter</title>
  <link rel="icon" href="/market-hunter-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/elliott.css">
</head>
<body>
  <main class="lab">
    <header class="lab-header">
      <a href="/" id="back">← Market Hunter</a>
      <button id="language" type="button">English</button>
    </header>
    <div class="eyebrow" dir="ltr">ELLIOTT LAB / DAILY STRUCTURE</div>
    <h1 id="heading">ساختار موجی سهمت را بررسی کن</h1>
    <p class="intro" id="intro">شمارش احتمالی الیوت، همراه با سطح تأیید و ابطال. این صفحه سفارش ایجاد نمی‌کند.</p>
    <form id="symbolForm" class="symbol-form">
      <label><span id="marketLabel">بازار</span><select id="market" name="market">
        <option value="us">US stocks</option><option value="ca">Canada stocks</option>
        <option value="crypto">Crypto · USD</option><option value="metals">Metal ETFs</option>
      </select></label>
      <label class="symbol-field"><span id="symbolLabel">نماد</span><input id="symbol" name="symbol" dir="ltr" placeholder="AAPL" maxlength="24" autocomplete="off" required></label>
      <button id="analyze" type="submit">بررسی نماد</button>
    </form>
    <p id="message" role="status" aria-live="polite">نماد را وارد کن؛ مثلاً AAPL، RY یا BTC.</p>
    <section id="result" hidden></section>
    <footer id="footer">فقط موج پنج‌تایی استاندارد و اصلاح سادهٔ ABC بررسی می‌شود. نبود ساختار مشخص، یک نتیجهٔ معتبر است.</footer>
  </main>
  <script type="module" src="/elliott.js"></script>
</body>
</html>
