name: SMC High-Vol Holdout Validation

on:
  push:
    branches:
      - research/smc-wd4h-tsx-validation-20261001
    paths:
      - 'scripts/validate-smc-highvol-holdout.mjs'
      - '.github/workflows/smc-highvol-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run untouched holdout validation
        run: node scripts/validate-smc-highvol-holdout.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-highvol-holdout-20261001
          path: |
            data/research/smc-wd4h-highvol-holdout-20261001.json
            data/research/smc-wd4h-highvol-holdout-20261001.md
          if-no-files-found: error
