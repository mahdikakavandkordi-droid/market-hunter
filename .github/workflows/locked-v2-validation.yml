name: Locked Market Hunter V2 Validation
on:
  workflow_dispatch:
  push:
    branches:
      - research/early-watch-validation-close-20260928
permissions:
  contents: read
concurrency:
  group: locked-market-hunter-v2-validation
  cancel-in-progress: true

env:
  V2_DATASET_REGISTRY: data/frozen/market-hunter-v2-numerical-snapshot/registry.json
  V2_DATASET_LOCK_MANIFEST: data/frozen/market-hunter-v2-numerical-snapshot/manifest.json
  V2_SNAPSHOT_DIR: data/frozen/market-hunter-v2-numerical-snapshot/files

jobs:
  materialize-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Contract tests
        run: npm test
      - name: Require Vercel artifact access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.SECRET_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "SECRET_VERCEL_TOKEN GitHub secret is required to retrieve the registered immutable numerical snapshot."
            exit 1
          fi
      - name: Materialize exact numerical snapshot artifact
        env:
          VERCEL_TOKEN: ${{ secrets.SECRET_VERCEL_TOKEN }}
        run: node scripts/materialize-vercel-artifact-rest.mjs
      - name: Verify exact downloaded bytes and provenance
        run: node scripts/verify-locked-validation-inputs.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: market-hunter-v2-numerical-snapshot
          path: |
            data/frozen/market-hunter-v2-numerical-snapshot/manifest.json
            data/frozen/market-hunter-v2-numerical-snapshot/files/*.json
          retention-days: 1
          if-no-files-found: error

  backtest:
    needs: materialize-and-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: market-hunter-v2-numerical-snapshot
          path: data/frozen/market-hunter-v2-numerical-snapshot
      - name: Re-verify materialized snapshot
        run: node scripts/verify-locked-validation-inputs.mjs
      - name: Run locked offline V2 backtest
        env:
          V2_BATCH_INDEX: ${{ matrix.batch }}
          V2_HORIZONS: 5,10,20
          V2_OPEN_FINAL_TEST: 0
        run: node scripts/run-locked-v2-backtest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: locked-v2-backtest-batch-${{ matrix.batch }}
          path: data/v2-backtest-batch-${{ matrix.batch }}.json
          retention-days: 7
          if-no-files-found: error

  aggregate-early-watch:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: market-hunter-v2-numerical-snapshot
          path: data/frozen/market-hunter-v2-numerical-snapshot
      - uses: actions/download-artifact@v4
        with:
          name: locked-v2-backtest-batch-0
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: locked-v2-backtest-batch-1
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: locked-v2-backtest-batch-2
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: locked-v2-backtest-batch-3
          path: data
      - name: Analyze Early Watch on locked outputs
        run: node scripts/analyze-early-watch-surface-replay.mjs
      - name: Record validation evidence identity
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          CODE_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync(process.env.V2_DATASET_LOCK_MANIFEST,'utf8'));
          const replay=JSON.parse(fs.readFileSync('data/v2-early-watch-surface-replay.json','utf8'));
          const evidence={
            codeSha:process.env.CODE_SHA,
            runId:Number(process.env.RUN_ID),
            runAttempt:Number(process.env.RUN_ATTEMPT),
            runUrl:process.env.SERVER_URL+'/'+process.env.REPOSITORY+'/actions/runs/'+process.env.RUN_ID,
            artifactId:manifest.artifact?.deploymentId||manifest.artifact?.id||null,
            validationCalendar:manifest.validationCalendar,
            finalTestOpened:replay.validationIdentity?.finalTestOpened===true,
            batchIdentities:manifest.batches.map(b=>({
              batchIndex:b.batchIndex,snapshotId:b.snapshotId,dataSha256:b.dataSha256,
              structureSha256:b.structureSha256,symbolCount:Array.isArray(b.symbols)?b.symbols.length:null
            }))
          };
          fs.writeFileSync('data/locked-validation-evidence.json',JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: locked-v2-validation-evidence
          path: |
            data/locked-validation-evidence.json
            data/v2-early-watch-surface-replay.json
            data/v2-backtest-batch-0.json
            data/v2-backtest-batch-1.json
            data/v2-backtest-batch-2.json
            data/v2-backtest-batch-3.json
            data/frozen/market-hunter-v2-numerical-snapshot/manifest.json
          retention-days: 14
          if-no-files-found: error
