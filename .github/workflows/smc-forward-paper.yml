name: SMC Forward Paper Track

on:
  push:
    branches:
      - research/smc-wd4h-tsx-validation-20261001
    paths:
      - 'scripts/smc-forward-paper.mjs'
      - 'scripts/smc-forward-expanded.mjs'
      - 'scripts/smc-forward-alternatives.mjs'
      - 'lib/smc-forward-runtime.mjs'
      - 'lib/smc-forward-evidence.mjs'
      - 'lib/smc-forward-portfolio.mjs'
      - 'lib/smc-momentum-shadow.mjs'
      - 'scripts/test-smc-forward-ledger.mjs'
      - 'scripts/test-smc-forward-timing.mjs'
      - 'scripts/test-smc-forward-portfolio.mjs'
      - 'scripts/test-smc-momentum-shadow.mjs'
      - '.github/workflows/smc-forward-paper.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: read

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/smc-wd4h-tsx-validation-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test forward ledger integrity
        run: node scripts/test-smc-forward-ledger.mjs
      - name: Test forward candle timing
        run: node scripts/test-smc-forward-timing.mjs
      - name: Test marked portfolio accounting
        run: node scripts/test-smc-forward-portfolio.mjs
      - name: Check expanded/alternatives syntax
        run: |
          node --check scripts/smc-forward-expanded.mjs
          node --check scripts/smc-forward-alternatives.mjs
      - name: Test momentum shadow
        run: node scripts/test-smc-momentum-shadow.mjs
      - name: Run frozen forward paper tracker
        run: node scripts/smc-forward-paper.mjs
      - name: Upload forward paper snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-forward-paper-latest
          path: |
            data/research/smc-wd4h-forward-paper-latest.json
            data/research/smc-wd4h-forward-paper-latest.md
          if-no-files-found: error
