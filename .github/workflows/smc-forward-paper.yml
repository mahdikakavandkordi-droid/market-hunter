name: SMC Forward Paper Track

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/smc-forward-paper.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'
      timezone: 'America/Toronto'

permissions:
  contents: write

concurrency:
  group: smc-forward-paper
  cancel-in-progress: false

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout operational helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - name: Checkout frozen evidence branch
        uses: actions/checkout@v4
        with:
          ref: research/smc-wd4h-tsx-validation-20261001
          path: evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test forward ledger integrity
        working-directory: evidence
        run: node scripts/test-smc-forward-ledger.mjs
      - name: Test forward candle timing
        working-directory: evidence
        run: node scripts/test-smc-forward-timing.mjs
      - name: Test momentum shadow
        working-directory: evidence
        run: node scripts/test-smc-momentum-shadow.mjs
      - name: Run frozen forward paper tracker
        working-directory: evidence
        run: node scripts/smc-forward-paper.mjs
      - name: Persist immutable forward ledger
        working-directory: evidence
        run: |
          node ../ops/scripts/persist-smc-evidence.mjs \
            --branch research/smc-wd4h-tsx-validation-20261001 \
            --message "data: update SMC forward paper ledger" \
            --files \
              data/research/smc-wd4h-forward-paper-ledger.json \
              data/research/smc-wd4h-forward-paper-latest.json \
              data/research/smc-wd4h-forward-paper-latest.md
      - name: Upload forward paper snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-forward-paper-latest
          path: |
            evidence/data/research/smc-wd4h-forward-paper-ledger.json
            evidence/data/research/smc-wd4h-forward-paper-latest.json
            evidence/data/research/smc-wd4h-forward-paper-latest.md
          if-no-files-found: error
