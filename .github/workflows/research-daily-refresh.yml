name: Research Daily Refresh

on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - '.github/workflows/research-daily-refresh.yml'
  workflow_dispatch:
  # GitHub schedules run only from the repository default branch.
  # This becomes an automatic daily cadence only after an explicitly approved merge.
  schedule:
    - cron: '45 22 * * *'

permissions:
  contents: write

concurrency:
  group: research-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate refresh and report scripts
        run: |
          node --check lib/market-pulse-engine.js
          node --check scripts/scan-market-pulse.mjs
          node --check scripts/backtest-market-pulse.mjs
          node --check scripts/scan-market-hunter-v2.mjs
          node --check scripts/build-market-pulse-report.mjs
          node --check scripts/build-daily-market-report.mjs
          node --check scripts/audit-daily-market-report-final.mjs

      - name: Refresh Market Pulse snapshot
        run: node scripts/scan-market-pulse.mjs

      - name: Refresh Market Pulse historical state evidence
        run: node scripts/backtest-market-pulse.mjs

      - name: Refresh V2 stock shortlist source
        shell: bash
        run: |
          set -euo pipefail
          weekday="$(date -u +%u)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$weekday" -le 5 ]; then
            node scripts/scan-market-hunter-v2.mjs
          else
            echo "Weekend schedule: keep the latest completed-session V2 stock snapshot."
          fi

      - name: Validate source snapshots
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const expected=['TSX','SP500','NASDAQ100','GOLD','SILVER','BTC','ETH'];

          const pulse=JSON.parse(fs.readFileSync('data/market-pulse-latest.json','utf8'));
          const pulseKeys=(pulse.markets||[]).map(x=>x.key);
          if(pulseKeys.length!==7||!expected.every(k=>pulseKeys.includes(k))){
            throw new Error('Market Pulse snapshot incomplete: '+JSON.stringify(pulseKeys));
          }

          const bt=JSON.parse(fs.readFileSync('data/market-pulse-state-backtest.json','utf8'));
          const btKeys=Object.keys(bt.markets||{});
          if(!expected.every(k=>btKeys.includes(k))||expected.some(k=>bt.markets[k]?.error)){
            throw new Error('Market Pulse backtest incomplete: '+JSON.stringify(Object.fromEntries(expected.map(k=>[k,bt.markets?.[k]?.error||'ok']))));
          }

          const v2=JSON.parse(fs.readFileSync('data/v2-latest-scan.json','utf8'));
          if(!Array.isArray(v2.integratedSurfacePicks)||v2.integratedSurfacePicks.length>6){
            throw new Error('V2 integrated shortlist invalid');
          }
          if((v2.integratedSurfaceCounts?.visible??v2.integratedSurfacePicks.length)!==v2.integratedSurfacePicks.length){
            throw new Error('V2 integrated shortlist count mismatch');
          }

          console.log('Validated 7 Market Pulse markets, complete historical evidence, and V2 max-6 source.');
          NODE

      - name: Build Market Pulse report
        run: node scripts/build-market-pulse-report.mjs

      - name: Build Daily Market Report
        run: node scripts/build-daily-market-report.mjs

      - name: Run final Daily Market Report audit
        run: node scripts/audit-daily-market-report-final.mjs

      - name: Validate report coherence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const latest=JSON.parse(fs.readFileSync('data/market-pulse-latest.json','utf8'));
          const pulse=JSON.parse(fs.readFileSync('data/market-pulse-report.json','utf8'));
          const hunter=JSON.parse(fs.readFileSync('data/v2-latest-scan.json','utf8'));
          const daily=JSON.parse(fs.readFileSync('data/daily-market-report.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/daily-market-report-final-audit.json','utf8'));

          if(pulse.sourceVersion!==latest.version) throw new Error('Market Pulse report/source version mismatch');
          if(daily.methodology?.source!==pulse.version) throw new Error('Daily report/Market Pulse version mismatch');
          if(daily.hunterContext?.generatedAt!==hunter.generatedAt) throw new Error('Daily report/Hunter snapshot freshness mismatch');
          if(Date.parse(pulse.generatedAt)<Date.parse(latest.generatedAt)) throw new Error('Market Pulse report is older than its source snapshot');
          if(Date.parse(daily.generatedAt)<Math.max(Date.parse(pulse.generatedAt),Date.parse(hunter.generatedAt))) throw new Error('Daily report is older than one of its inputs');
          if(audit.status!=='PASS') throw new Error('Final Daily Market Report audit did not pass');

          console.log('Validated coherent source → Pulse report → Daily report → audit chain.');
          NODE

      - name: Commit validated daily research package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add             data/market-pulse-latest.json             data/market-pulse-state-backtest.json             data/market-pulse-report.json             data/v2-latest-scan.json             data/daily-market-report.json             data/daily-market-report.md             data/daily-market-report-final-audit.json
          if git diff --cached --quiet; then
            echo "No validated daily refresh changes."
            exit 0
          fi
          git commit -m "research: refresh validated daily market package"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$branch"
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
