name: SMC Crypto and Metals Forward

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/smc-forward-alternatives.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: write

concurrency:
  group: smc-forward-alternatives
  cancel-in-progress: false

jobs:
  alternatives-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operational helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - name: Checkout frozen evidence branch
        uses: actions/checkout@v4
        with:
          ref: research/smc-wd4h-tsx-validation-20261001
          path: evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test momentum shadow
        working-directory: evidence
        run: node scripts/test-smc-momentum-shadow.mjs
      - name: Run crypto-15 and metals-5 forward cohorts
        working-directory: evidence
        run: node scripts/smc-forward-alternatives.mjs
      - name: Persist alternative forward ledgers
        working-directory: evidence
        run: |
          node ../ops/scripts/persist-smc-evidence.mjs \
            --branch research/smc-wd4h-tsx-validation-20261001 \
            --message "data: update crypto/metals SMC forward cohorts" \
            --files \
              evidence/data/research/smc-wd4h-forward-crypto-15-ledger.json \
              evidence/data/research/smc-wd4h-forward-crypto-15-latest.json \
              evidence/data/research/smc-wd4h-forward-crypto-15-latest.md \
              evidence/data/research/smc-wd4h-forward-metals-5-ledger.json \
              evidence/data/research/smc-wd4h-forward-metals-5-latest.json \
              evidence/data/research/smc-wd4h-forward-metals-5-latest.md \
              evidence/data/research/smc-wd4h-forward-alternatives-summary.json
      - name: Upload alternative forward snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-forward-alternatives-latest
          path: |
            evidence/data/research/smc-wd4h-forward-crypto-15-ledger.json
            evidence/data/research/smc-wd4h-forward-crypto-15-latest.json
            evidence/data/research/smc-wd4h-forward-crypto-15-latest.md
            evidence/data/research/smc-wd4h-forward-metals-5-ledger.json
            evidence/data/research/smc-wd4h-forward-metals-5-latest.json
            evidence/data/research/smc-wd4h-forward-metals-5-latest.md
            evidence/data/research/smc-wd4h-forward-alternatives-summary.json
          if-no-files-found: error
