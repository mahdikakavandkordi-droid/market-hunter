name: Attractive Growth Final Audit
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/audit-attractive-growth-final.mjs'
      - '.github/workflows/attractive-growth-final-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit-attractive-growth-final.mjs
      - name: Commit final audit
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/attractive-growth-final-audit.json
          git commit -m "research: save Attractive Growth final audit" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
