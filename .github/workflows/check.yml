name: Check scanner
on:
  push:
    branches-ignore:
      - research/market-hunter-ui-work
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check api/scan.js
      - run: node --check scripts/backtest-hunter.mjs
      - run: npm test
