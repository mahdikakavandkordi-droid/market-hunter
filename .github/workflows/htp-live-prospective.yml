name: HTP Live Prospective Collection

on:
  workflow_dispatch:
  schedule:
    # Primary post-close capture plus a later same-UTC-date recovery pass.
    - cron: '45 22 * * 1-5'
    - cron: '35 23 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/workflows/htp-live-prospective.yml']

permissions:
  contents: write

concurrency:
  group: htp-live-prospective-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HTP_FORWARD_DIR: ${{ github.workspace }}/evidence/data/research/healthy-trend-pullback-forward
      HTP_PINNED_COLLECTOR_SHA: df4cdb289f3f111a6c7dcbe1d73e0d694bf25405
    steps:
      - name: Checkout approved collector code
        uses: actions/checkout@v4
        with:
          ref: df4cdb289f3f111a6c7dcbe1d73e0d694bf25405
          path: collector
          persist-credentials: false

      - name: Checkout durable prospective evidence
        uses: actions/checkout@v4
        with:
          ref: research/htp-forward-evidence
          path: evidence

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify approved code
        working-directory: collector
        run: npm test

      - name: Audit existing evidence before collection
        working-directory: collector
        run: node scripts/audit-healthy-trend-pullback-forward.mjs

      - name: Check whether today's canonical capture already exists
        id: precheck
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file=process.env.HTP_FORWARD_DIR+'/observations.jsonl';
          const today=new Date().toISOString().slice(0,10);
          const rows=fs.existsSync(file)
            ? fs.readFileSync(file,'utf8').split('\n').filter(Boolean).map(JSON.parse)
            : [];
          const complete=rows.filter(x =>
            x.marketAsOf===today &&
            ['complete_nonzero','complete_zero_pick'].includes(x.status)
          );
          const models=new Set(complete.map(x=>x.model));
          const ok=complete.length===3 &&
            ['core','trend_rs','early_watch'].every(x=>models.has(x));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'complete='+ok+'\n');
          console.log(JSON.stringify({today,canonicalRecords:complete.length,complete:ok}));
          NODE

      - name: Collect decisions if needed and reconcile matured outcomes
        id: collector
        continue-on-error: true
        working-directory: collector
        shell: bash
        env:
          CAPTURE_WAS_COMPLETE: ${{ steps.precheck.outputs.complete }}
        run: |
          set -u
          for attempt in 1 2 3; do
            if [ "$CAPTURE_WAS_COMPLETE" = "true" ]; then
              echo "HTP outcome reconciliation attempt $attempt/3; today's canonical decisions already exist and remain immutable."
            else
              echo "HTP live capture attempt $attempt/3"
            fi

            GITHUB_SHA="$HTP_PINNED_COLLECTOR_SHA" node scripts/collect-healthy-trend-pullback-forward.mjs
            rc=$?
            echo "collector_exit_code=$rc"

            complete="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file=process.env.HTP_FORWARD_DIR+'/observations.jsonl';
          const today=new Date().toISOString().slice(0,10);
          const rows=fs.existsSync(file)
            ? fs.readFileSync(file,'utf8').split('\n').filter(Boolean).map(JSON.parse)
            : [];
          const complete=rows.filter(x =>
            x.marketAsOf===today &&
            ['complete_nonzero','complete_zero_pick'].includes(x.status)
          );
          const models=new Set(complete.map(x=>x.model));
          process.stdout.write(String(
            complete.length===3 &&
            ['core','trend_rs','early_watch'].every(x=>models.has(x))
          ));
          NODE
          )"

            last_failures="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file=process.env.HTP_FORWARD_DIR+'/runs.jsonl';
          const rows=fs.existsSync(file)
            ? fs.readFileSync(file,'utf8').split('\n').filter(Boolean).map(JSON.parse)
            : [];
          const last=rows.at(-1);
          process.stdout.write(String(last?.status==='collected' ? Number(last?.coverage?.failures ?? 0) : -1));
          NODE
          )"
            echo "latest_collector_failure_count=$last_failures"

            if [ "$CAPTURE_WAS_COMPLETE" = "true" ]; then
              if [ "$rc" -eq 0 ] && [ "$last_failures" = "0" ]; then
                echo "Matured-outcome reconciliation completed with full fetch coverage; canonical observations were not replaced."
                exit 0
              fi
            elif [ "$complete" = "true" ]; then
              echo "Canonical same-day capture is complete."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Collection or outcome reconciliation is incomplete; retrying in 30 seconds."
              sleep 30
            fi
          done

          if [ "$CAPTURE_WAS_COMPLETE" = "true" ]; then
            echo "Outcome reconciliation remained degraded after three attempts."
          else
            echo "No complete canonical capture after three same-day attempts."
          fi
          exit 2

      - name: Replay and audit captured evidence
        id: audit
        if: always()
        continue-on-error: true
        working-directory: collector
        run: node scripts/audit-healthy-trend-pullback-forward.mjs

      - name: Classify today's evidence state
        id: state
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=process.env.HTP_FORWARD_DIR;
          const today=new Date().toISOString().slice(0,10);
          const readJsonl=name=>{
            const file=root+'/'+name;
            return fs.existsSync(file)
              ? fs.readFileSync(file,'utf8').split('\n').filter(Boolean).map(JSON.parse)
              : [];
          };
          const observations=readJsonl('observations.jsonl');
          const inputs=readJsonl('inputs.jsonl');
          const runs=readJsonl('runs.jsonl');
          const complete=observations.filter(x =>
            x.marketAsOf===today &&
            ['complete_nonzero','complete_zero_pick'].includes(x.status)
          );
          const models=new Set(complete.map(x=>x.model));
          let state='unknown';
          if(complete.length===3 && ['core','trend_rs','early_watch'].every(x=>models.has(x))){
            state='complete';
          }else if(inputs.some(x=>x.marketAsOf===today)){
            state='partial';
          }else{
            const last=runs.at(-1);
            if(last?.status==='market_not_completed')state='no_completed_market_session';
            else if(last?.status==='collector_failure')state='collector_failure';
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'state='+state+'\n');
          console.log(JSON.stringify({
            today,state,
            canonicalRecords:complete.length,
            attemptsToday:inputs.filter(x=>x.marketAsOf===today).length,
            lastRunStatus:runs.at(-1)?.status||null
          }));
          NODE

      - name: Stamp operational activation metadata
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file=process.env.HTP_FORWARD_DIR+'/status.json';
          if(!fs.existsSync(file))process.exit(0);
          const status=JSON.parse(fs.readFileSync(file,'utf8'));
          status.operationalActivation={
            state:'active',
            workflow:'HTP Live Prospective Collection',
            defaultBranch:'main',
            evidenceBranch:'research/htp-forward-evidence',
            pinnedCollectorSha:process.env.HTP_PINNED_COLLECTOR_SHA,
            schedulesUtc:['22:45 Mon-Fri','23:35 Mon-Fri recovery'],
            sameDayRetryAttempts:3,
            updatedAt:new Date().toISOString()
          };
          fs.writeFileSync(file,JSON.stringify(status,null,2)+'\n');
          NODE

      - name: Preserve capture and failure evidence
        if: always()
        working-directory: evidence
        run: |
          set -euo pipefail
          git config user.name "market-hunter-forward-research"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/healthy-trend-pullback-forward
          if git diff --cached --quiet; then
            echo "No new evidence."
            exit 0
          fi
          git commit -m "research: append pinned HTP prospective capture"
          git push origin HEAD:research/htp-forward-evidence

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htp-live-prospective-diagnostics
          path: |
            evidence/data/research/healthy-trend-pullback-forward/audit.json
            evidence/data/research/healthy-trend-pullback-forward/status.json
            evidence/data/research/healthy-trend-pullback-forward/runs.jsonl
            evidence/data/research/healthy-trend-pullback-forward/inputs.jsonl
            evidence/data/research/healthy-trend-pullback-forward/observations.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Report degraded or failed prospective collection
        if: always()
        shell: bash
        run: |
          state="${{ steps.state.outputs.state }}"
          audit="${{ steps.audit.outcome }}"
          echo "HTP evidence state: $state"
          echo "Audit outcome: $audit"

          if [ "$audit" != "success" ]; then
            echo "Forward evidence audit failed."
            exit 1
          fi

          if [ "$state" = "partial" ] || [ "$state" = "collector_failure" ] || [ "$state" = "unknown" ]; then
            echo "No valid canonical prospective observation was produced for today's attempted market session."
            exit 1
          fi

          # A holiday / no completed market session is not a research failure.
          # A complete capture (including three legitimate zero-pick records) passes.
          exit 0
