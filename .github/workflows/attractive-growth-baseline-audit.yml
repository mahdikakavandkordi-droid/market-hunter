name: Attractive Growth Baseline Audit
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/analyze-attractive-growth-baseline.mjs'
      - '.github/workflows/attractive-growth-baseline-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-attractive-growth-baseline.mjs
      - name: Commit Attractive Growth audit
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/attractive-growth-baseline-audit.json
          git commit -m "research: save Attractive Growth baseline audit" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
