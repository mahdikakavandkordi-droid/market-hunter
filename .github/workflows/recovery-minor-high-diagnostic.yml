name: Recovery Minor High Diagnostic
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/analyze-recovery-minor-high.mjs'
      - '.github/workflows/recovery-minor-high-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Analyze Recovery minor-high confirmation
        run: node scripts/analyze-recovery-minor-high.mjs
      - name: Commit compact diagnostic
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/recovery-minor-high-diagnostic.json
          git commit -m "research: save Recovery minor-high diagnostic" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
