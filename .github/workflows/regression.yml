name: Regression Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Run required regression suite
        run: npm test
      - name: Verify fundamental pilot
        run: |
          npm run test:fundamental
          python3 scripts/test-fundamental-inline.py
          node scripts/test-fundamental-context.mjs
      - name: Fundamental pipeline regression
        run: |
          npm run test:fundamental
          node scripts/test-fundamental-build.mjs
          node scripts/test-fundamental-refresh.mjs
          node scripts/test-fundamental-context.mjs
          python3 scripts/test-fundamental-inline.py
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: npm run test:browser
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: test-results/
          retention-days: 7
