name: Recovery Structure Diagnostic Summary
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/summarize-recovery-structure-diagnostic.mjs'
      - '.github/workflows/recovery-structure-summary.yml'
      - 'data/v2-backtest-batch-*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Summarize Recovery structure diagnostic
        run: node scripts/summarize-recovery-structure-diagnostic.mjs
      - name: Commit summary
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/recovery-structure-diagnostic-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: refresh Recovery structure summary"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin research/market-hunter-v2-rebuild
            if git push origin HEAD:research/market-hunter-v2-rebuild; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
