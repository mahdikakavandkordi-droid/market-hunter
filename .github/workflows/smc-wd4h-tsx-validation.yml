name: SMC W-D-4H TSX Validation

on:
  push:
    branches:
      - research/smc-wd4h-tsx-validation-20261001
    paths:
      - 'scripts/validate-smc-wd4h-tsx.mjs'
      - '.github/workflows/smc-wd4h-tsx-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run frozen TSX validation
        run: node scripts/validate-smc-wd4h-tsx.mjs
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-tsx-validation-20261001
          path: |
            data/research/smc-wd4h-tsx-validation-20261001.json
            data/research/smc-wd4h-tsx-validation-20261001.md
          if-no-files-found: error
