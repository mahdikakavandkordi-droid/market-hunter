name: Integrated Cross Stage Cap Diagnostic
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/analyze-integrated-cross-stage-cap.mjs'
      - '.github/workflows/integrated-cross-stage-cap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-integrated-cross-stage-cap.mjs
      - name: Commit cross-stage diagnostic
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/integrated-cross-stage-cap-diagnostic.json
          git commit -m "research: save integrated cross-stage cap diagnostic" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
