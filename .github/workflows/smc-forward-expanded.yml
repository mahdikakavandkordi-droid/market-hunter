name: SMC Expanded Forward Cohorts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/smc-forward-expanded.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 18 * * 1-5'
      timezone: 'America/Toronto'

permissions:
  contents: write

concurrency:
  group: smc-forward-expanded
  cancel-in-progress: false

jobs:
  expanded-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operational helper
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - name: Checkout frozen evidence branch
        uses: actions/checkout@v4
        with:
          ref: research/smc-wd4h-tsx-validation-20261001
          path: evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test forward ledger integrity
        working-directory: evidence
        run: node scripts/test-smc-forward-ledger.mjs
      - name: Test forward candle timing
        working-directory: evidence
        run: node scripts/test-smc-forward-timing.mjs
      - name: Test marked portfolio accounting
        working-directory: evidence
        run: node scripts/test-smc-forward-portfolio.mjs
      - name: Test momentum shadow
        working-directory: evidence
        run: node scripts/test-smc-momentum-shadow.mjs
      - name: Run TSX-extra and US-75 forward cohorts
        working-directory: evidence
        run: node scripts/smc-forward-expanded.mjs
      - name: Persist expanded forward ledgers
        working-directory: evidence
        run: |
          node ../ops/scripts/persist-smc-evidence.mjs \
            --branch research/smc-wd4h-tsx-validation-20261001 \
            --message "data: update expanded SMC forward cohorts" \
            --files \
              data/research/smc-wd4h-forward-tsx-extra-ledger.json \
              data/research/smc-wd4h-forward-tsx-extra-evidence-v2-latest.json \
              data/research/smc-wd4h-forward-tsx-extra-evidence-v2-latest.md \
              data/research/smc-wd4h-forward-us-75-ledger.json \
              data/research/smc-wd4h-forward-us-75-evidence-v2-latest.json \
              data/research/smc-wd4h-forward-us-75-evidence-v2-latest.md \
              data/research/smc-wd4h-forward-expanded-evidence-v2-summary.json
      - name: Upload expanded forward snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-forward-expanded-latest
          path: |
            evidence/data/research/smc-wd4h-forward-tsx-extra-evidence-v2-latest.json
            evidence/data/research/smc-wd4h-forward-tsx-extra-evidence-v2-latest.md
            evidence/data/research/smc-wd4h-forward-us-75-evidence-v2-latest.json
            evidence/data/research/smc-wd4h-forward-us-75-evidence-v2-latest.md
            evidence/data/research/smc-wd4h-forward-expanded-evidence-v2-summary.json
            evidence/data/research/smc-wd4h-forward-tsx-extra-latest.json
            evidence/data/research/smc-wd4h-forward-us-75-latest.json
          if-no-files-found: error
