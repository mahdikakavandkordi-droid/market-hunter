name: SMC Expanded Forward Cohorts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/smc-forward-expanded.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 18 * * 1-5'
      timezone: 'America/Toronto'

permissions:
  contents: write

jobs:
  expanded-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/smc-wd4h-tsx-validation-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run TSX-extra and US-75 forward cohorts
        run: node scripts/smc-forward-expanded.mjs
      - name: Persist expanded forward ledgers
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/research/smc-wd4h-forward-tsx-extra-ledger.json
          git add data/research/smc-wd4h-forward-tsx-extra-latest.json
          git add data/research/smc-wd4h-forward-tsx-extra-latest.md
          git add data/research/smc-wd4h-forward-us-75-ledger.json
          git add data/research/smc-wd4h-forward-us-75-latest.json
          git add data/research/smc-wd4h-forward-us-75-latest.md
          git add data/research/smc-wd4h-forward-expanded-summary.json
          if git diff --cached --quiet; then
            echo "No expanded forward changes"
          else
            git commit -m "data: update expanded SMC forward cohorts"
            git push origin HEAD:research/smc-wd4h-tsx-validation-20261001
          fi
      - name: Upload expanded forward snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smc-wd4h-forward-expanded-latest
          path: |
            data/research/smc-wd4h-forward-tsx-extra-ledger.json
            data/research/smc-wd4h-forward-tsx-extra-latest.json
            data/research/smc-wd4h-forward-tsx-extra-latest.md
            data/research/smc-wd4h-forward-us-75-ledger.json
            data/research/smc-wd4h-forward-us-75-latest.json
            data/research/smc-wd4h-forward-us-75-latest.md
            data/research/smc-wd4h-forward-expanded-summary.json
          if-no-files-found: error
