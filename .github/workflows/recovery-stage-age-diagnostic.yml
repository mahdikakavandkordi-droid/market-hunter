name: Recovery Stage Age Diagnostic
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/analyze-recovery-stage-age.mjs'
      - '.github/workflows/recovery-stage-age-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-recovery-stage-age.mjs
      - name: Commit stage-age report
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/recovery-stage-age-diagnostic.json
          git commit -m "research: save Recovery stage-age diagnostic" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
