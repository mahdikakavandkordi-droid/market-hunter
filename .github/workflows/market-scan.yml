name: Market Hunter Scan

on:
  push:
    branches: [main]
    paths:
      - 'api/scan.js'
      - 'scripts/capture-scan.mjs'
      - 'scripts/test-scan.mjs'
      - '.github/workflows/market-scan.yml'
  schedule:
    - cron: "0 */4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scanner tests
        run: node scripts/test-scan.mjs

      - name: Verify deployed shadow version
        id: shadow
        continue-on-error: true
        run: node scripts/capture-scan.mjs

      - name: Shadow build not deployed yet
        if: steps.shadow.outcome == 'failure'
        run: echo "Skipping history write until production serves hunter-1.4-candidate-v2-shadow."

      - name: Save history if changed
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Update Market Hunter scan history"
          git push
