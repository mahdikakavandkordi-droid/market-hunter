name: Audit Early Watch Outlier Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - research/early-watch-outlier-integrity-20260928
    paths:
      - scripts/audit-early-watch-outlier-integrity.mjs
      - .github/workflows/audit-early-watch-outlier-integrity.yml

permissions:
  contents: write

env:
  MH_ARCHIVE_REF: locked-v2-validation-36420714736-archive-v1
  MH_ARCHIVE_ROOT: archive/locked-v2-validation/run-36420714736
  V2_DATASET_LOCK_MANIFEST: data/frozen/market-hunter-v2-numerical-snapshot/manifest.json
  V2_SNAPSHOT_DIR: data/frozen/market-hunter-v2-numerical-snapshot/files
  EARLY_WATCH_EPISODES: data/research/early-watch-episode-stability/episodes.json
  EARLY_WATCH_OUTLIER_OUT: data/research/early-watch-outlier-integrity
  V2_OPEN_FINAL_TEST: "0"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize pinned locked snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$V2_SNAPSHOT_DIR"
          git show "$MH_ARCHIVE_REF:$MH_ARCHIVE_ROOT/snapshot/manifest.json" > "$V2_DATASET_LOCK_MANIFEST"
          for i in 0 1 2 3; do
            git show "$MH_ARCHIVE_REF:$MH_ARCHIVE_ROOT/snapshot/files/batch-$i.json" > "$V2_SNAPSHOT_DIR/batch-$i.json"
          done

      - name: Verify exact archived snapshot checksums
        shell: bash
        run: |
          set -euo pipefail
          sums=$(git show "$MH_ARCHIVE_REF:$MH_ARCHIVE_ROOT/SHA256SUMS")
          for i in 0 1 2 3; do
            expected=$(printf '%s\n' "$sums" | grep "snapshot/files/batch-$i.json" | awk '{print $1}')
            actual=$(sha256sum "$V2_SNAPSHOT_DIR/batch-$i.json" | awk '{print $1}')
            test "$actual" = "$expected"
          done
          expected=$(printf '%s\n' "$sums" | grep "snapshot/manifest.json" | tail -1 | awk '{print $1}')
          actual=$(sha256sum "$V2_DATASET_LOCK_MANIFEST" | awk '{print $1}')
          test "$actual" = "$expected"

      - name: Run repository tests
        run: npm test

      - name: Audit top Validation outliers
        run: node scripts/audit-early-watch-outlier-integrity.mjs

      - name: Assert Historical Final sealed and calculations matched
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('data/research/early-watch-outlier-integrity/outlier-integrity.json','utf8'));
          if(j.finalTestOpened!==false||j.historicalFinal!=='SEALED')throw new Error('Historical Final not sealed');
          if(j.summary?.calculationMismatchCount!==0)throw new Error('Outlier calculation mismatches');
          console.log('PASS: outlier calculations independently match locked snapshot with Historical Final sealed');
          NODE

      - name: Write run metadata
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/research/early-watch-outlier-integrity/run-metadata.json';
          fs.writeFileSync(p,JSON.stringify({
            format:'market-hunter-early-watch-outlier-integrity-run-v1',
            codeSha:process.env.GITHUB_SHA,
            runId:Number(process.env.GITHUB_RUN_ID),
            archiveRef:process.env.MH_ARCHIVE_REF,
            validationRunId:36420714736,
            finalTestOpened:false
          },null,2)+'\n');
          NODE

      - name: Upload audit package
        uses: actions/upload-artifact@v4
        with:
          name: early-watch-outlier-integrity-audit
          path: data/research/early-watch-outlier-integrity
          retention-days: 14
          if-no-files-found: error

      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "market-hunter-research"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/early-watch-outlier-integrity
          if git diff --cached --quiet; then
            echo "Audit outputs unchanged."
          else
            git commit -m "research: record Early Watch outlier integrity audit"
            git push origin "HEAD:research/early-watch-outlier-integrity-20260928"
          fi
