name: Attractive Growth Surface Replay
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/analyze-attractive-growth-surface-replay.mjs'
      - '.github/workflows/attractive-growth-surface-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-attractive-growth-surface-replay.mjs
      - name: Commit surface replay
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/attractive-growth-surface-replay.json
          git commit -m "research: save Attractive Growth surface replay" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
