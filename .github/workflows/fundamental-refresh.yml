name: Fundamental Context Refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fundamental-refresh.yml']
  workflow_dispatch:
  schedule:
    # Financial filings need a daily check, not hourly quote polling.
    - cron: '15 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: fundamental-context-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify financial publication guards
        run: |
          node scripts/test-fundamental-pilot.mjs
          node scripts/test-fundamental-build.mjs
          node scripts/test-fundamental-refresh.mjs
          python3 scripts/test-fundamental-inline.py
      - name: Check eligible SEC filings and reconcile new sources
        env:
          SEC_USER_AGENT: 'MarketHunter https://github.com/mahdikakavandkordi-droid/market-hunter'
        run: node scripts/refresh-fundamentals.mjs --cache "$RUNNER_TEMP/fundamental-sources"
      - name: Validate public projection
        run: node scripts/test-fundamental-context.mjs
      - name: Commit financial data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'market-hunter-financial-context'
          git config user.email 'market-hunter-financial-context@users.noreply.github.com'
          git add data/fundamentals/inputs data/fundamentals/source-checks.json data/fundamental-context.json data/research/fundamental-pilot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh verified financial context'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
