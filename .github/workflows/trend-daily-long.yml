name: Daily US long-only forward trial
on:
  push:
    branches: [main, feature/trend-daily-forward-launch]
    paths: [.github/workflows/trend-daily-long.yml]
  workflow_dispatch:
  schedule:
    - cron: '25 22 * * 1-5'
    - cron: '40 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: trend-daily-long-v1
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: research/trend-daily-long-evidence
          path: evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-trend-daily-long.mjs
      - run: node scripts/trend-daily-forward.mjs
        env:
          TREND_DAILY_ROOT: evidence/data/research/trend-daily-long
      - name: Preserve daily accounts
        if: always()
        working-directory: evidence
        run: |
          git config user.name market-hunter-research
          git config user.email actions@users.noreply.github.com
          git add data/research/trend-daily-long/ledger.json data/research/trend-daily-long/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: record daily US long-only forward trial"
          git push origin HEAD:research/trend-daily-long-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-us-long-only-inputs
          path: evidence/data/research/trend-daily-long/
          retention-days: 90
