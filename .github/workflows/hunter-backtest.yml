name: Hunter Historical Backtest
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated Yahoo symbols'
        required: false
        default: 'RY.TO,SHOP.TO,LUN.TO,CNQ.TO,CNR.TO,T.TO,AAPL.TO'
      range:
        description: 'Yahoo history range'
        required: false
        default: '2y'
      horizon:
        description: 'Forward trading sessions'
        required: false
        default: '10'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run no-lookahead backtest
        env:
          BACKTEST_SYMBOLS: ${{ inputs.symbols }}
          BACKTEST_RANGE: ${{ inputs.range }}
          BACKTEST_HORIZON: ${{ inputs.horizon }}
        run: node scripts/backtest-hunter.mjs
      - name: Commit report
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "backtest: refresh Hunter historical validation"
          git push
