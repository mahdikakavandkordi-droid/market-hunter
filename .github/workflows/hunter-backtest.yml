name: Hunter Historical Backtest
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated Yahoo symbols'
        required: false
        default: 'RY.TO,TD.TO,BMO.TO,BNS.TO,CM.TO,NA.TO,SHOP.TO,CSU.TO,OTEX.TO,LUN.TO,ABX.TO,AEM.TO,CNQ.TO,SU.TO,CVE.TO,IMO.TO,CNR.TO,CP.TO,WCN.TO,FTS.TO,EMA.TO,T.TO,BCE.TO,TRP.TO,ENB.TO,ATD.TO,DOL.TO,L.TO,MRU.TO,QSR.TO,CCO.TO,NTR.TO,POW.TO,MFC.TO,SLF.TO,GWO.TO,BN.TO,BAM.TO,WSP.TO,STN.TO,TFII.TO,MG.TO,GIB-A.TO,AAPL.TO,MSFT.TO,NVDA.TO,AMZN.TO,GOOG.TO,META.TO,TSLA.TO'
      range:
        description: 'Yahoo history range'
        required: false
        default: '2y'
      holdout_end:
        description: 'Optional last signal date (YYYY-MM-DD) for untouched historical holdout'
        required: false
        default: ''
      horizons:
        description: 'Forward trading sessions'
        required: false
        default: '5,10,20'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run no-lookahead backtest
        env:
          BACKTEST_SYMBOLS: ${{ inputs.symbols }}
          BACKTEST_RANGE: ${{ inputs.range }}
          BACKTEST_HORIZONS: ${{ inputs.horizons }}
          BACKTEST_HOLDOUT_END: ${{ inputs.holdout_end }}
        run: node scripts/backtest-hunter.mjs
      - name: Commit report
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "backtest: refresh Hunter historical validation"
          git push
