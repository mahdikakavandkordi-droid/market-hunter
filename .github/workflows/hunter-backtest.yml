name: Hunter Historical Backtest
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated Yahoo symbols'
        required: false
        default: 'RY.TO,TD.TO,BMO.TO,BNS.TO,CM.TO,NA.TO,SHOP.TO,CSU.TO,OTEX.TO,LUN.TO,ABX.TO,AEM.TO,CNQ.TO,SU.TO,CVE.TO,IMO.TO,CNR.TO,CP.TO,WCN.TO,FTS.TO,EMA.TO,T.TO,BCE.TO,TRP.TO,ENB.TO,ATD.TO,DOL.TO,L.TO,MRU.TO,QSR.TO,CCO.TO,NTR.TO,POW.TO,MFC.TO,SLF.TO,GWO.TO,BN.TO,BAM.TO,WSP.TO,STN.TO,TFII.TO,MG.TO,GIB-A.TO,AAPL.TO,MSFT.TO,NVDA.TO,AMZN.TO,GOOG.TO,META.TO,TSLA.TO'
      universe:
        description: 'Universe preset: default or canadian-core'
        required: false
        default: 'default'
      range:
        description: 'Yahoo history range'
        required: false
        default: '5y'
      holdout_end:
        description: 'Last signal date: YYYY-MM-DD, or NONE for full range'
        required: false
        default: '2024-12-31'
      horizons:
        description: 'Forward trading sessions'
        required: false
        default: '5,10,20'
  pull_request:
    paths:
      - 'scripts/backtest-hunter.mjs'
      - '.github/workflows/hunter-backtest.yml'
  push:
    paths:
      - 'scripts/backtest-hunter.mjs'
      - '.github/workflows/hunter-backtest.yml'
permissions:
  contents: write

# PR runs validate research output without pushing generated files back.

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Run no-lookahead backtest
        env:
          BACKTEST_SYMBOLS: ${{ inputs.universe == 'canadian-core' && '' || inputs.symbols }}
          BACKTEST_UNIVERSE: ${{ github.ref == 'refs/heads/research/compact-stage-summary' && github.event_name == 'push' && 'canadian-core' || inputs.universe || 'default' }}
          BACKTEST_BATCH_INDEX: ${{ matrix.batch }}
          BACKTEST_BATCH_COUNT: 4
          BACKTEST_RANGE: ${{ inputs.range || '5y' }}
          BACKTEST_HORIZONS: ${{ inputs.horizons || '5,10,20' }}
          BACKTEST_HOLDOUT_END: ${{ github.event_name == 'workflow_dispatch' && inputs.holdout_end != 'NONE' && inputs.holdout_end || '' }}
        run: node scripts/backtest-hunter.mjs
      - name: Commit report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/backtest-batch-${{ matrix.batch }}.json data/stage-research-summary-batch-${{ matrix.batch }}.json data/early-reclaim-cases-batch-${{ matrix.batch }}.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "backtest: refresh Hunter historical validation batch ${{ matrix.batch }}"
          git pull --rebase origin research/compact-stage-summary
          git push
