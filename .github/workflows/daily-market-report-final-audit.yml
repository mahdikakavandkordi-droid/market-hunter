name: Daily Market Report Final Audit
on:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'data/daily-market-report.json'
      - 'data/daily-market-report.md'
      - 'index.html'
      - 'scripts/audit-daily-market-report-final.mjs'
      - '.github/workflows/daily-market-report-final-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/audit-daily-market-report-final.mjs
      - name: Commit final audit
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/daily-market-report-final-audit.json
          git commit -m "research: save Daily Market Report final audit" || exit 0
          git pull --rebase origin research/market-hunter-v2-rebuild
          git push origin HEAD:research/market-hunter-v2-rebuild
