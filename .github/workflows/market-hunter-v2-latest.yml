name: Market Hunter V2 Current Research Scan
on:
  workflow_dispatch:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/scan-market-hunter-v2.mjs'
      - 'lib/market-hunter-v2-engine.js'
      - '.github/workflows/market-hunter-v2-latest.yml'
permissions:
  contents: write
concurrency:
  group: market-hunter-v2-current-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run V2 current research scan
        run: node scripts/scan-market-hunter-v2.mjs
      - name: Commit current research snapshot
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/v2-latest-scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: refresh V2 current scan"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin research/market-hunter-v2-rebuild
            if git push origin HEAD:research/market-hunter-v2-rebuild; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
