name: Early Watch Surface Replay Analysis
on:
  workflow_dispatch:
  push:
    branches:
      - research/market-hunter-v2-rebuild
    paths:
      - 'scripts/analyze-early-watch-surface-replay.mjs'
      - '.github/workflows/early-watch-surface-replay.yml'
permissions:
  contents: write
concurrency:
  group: early-watch-surface-replay-analysis
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Analyze global daily surfaced shortlist
        run: node scripts/analyze-early-watch-surface-replay.mjs
      - name: Commit replay report
        run: |
          git config user.name "market-hunter-bot"
          git config user.email "market-hunter-bot@users.noreply.github.com"
          git add data/v2-early-watch-surface-replay.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: refresh Early Watch surface replay"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin research/market-hunter-v2-rebuild
            if git push origin HEAD:research/market-hunter-v2-rebuild; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
