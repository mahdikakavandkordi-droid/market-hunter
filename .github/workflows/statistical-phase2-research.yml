name: Isolated cross asset phase2 research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/statistical/**'
      - '.github/workflows/statistical-phase2-research.yml'

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V1 model invariants
        run: node research/statistical/test.mjs
      - name: Check phase2 model and anti-lookahead invariants
        run: node research/statistical/phase2-test.mjs
      - name: Run lagged macro, HAR-style volatility and regime research
        run: node research/statistical/run-phase2.mjs --from 2020-01-01 --asof 2026-10-13 --output research/statistical/phase2-results.json
      - name: Upload report (no licensed OHLC bars)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistical-phase2-20261013
          path: research/statistical/phase2-results.json
          if-no-files-found: ignore
          retention-days: 30
