<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Market Hunter">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/market-hunter-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/market-hunter-icon.svg">
  <link rel="stylesheet" href="/app.css">
  <title>Market Hunter</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brandmark"><i></i><i></i><i></i></div>
        <div><h1>Market Hunter</h1><p id="asOf">Research dashboard</p></div>
      </div>
      <button class="refresh" id="refreshBtn" aria-label="Refresh">↻</button>
    </header>

    <nav class="nav" aria-label="Primary">
      <button class="navbtn active" data-view="home">Home</button>
      <button class="navbtn" data-view="shortlist">Shortlist</button>
      <button class="navbtn" data-view="portfolio">Portfolio</button>
      <button class="navbtn" data-view="watchlist">Watchlist</button>
    </nav>

    <main>
      <section class="view active" id="homeView"></section>
      <section class="view" id="shortlistView"></section>
      <section class="view" id="portfolioView"></section>
      <section class="view" id="watchlistView"></section>
    </main>
  </div>

  <div class="modal" id="positionModal" aria-hidden="true"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
