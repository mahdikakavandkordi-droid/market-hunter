<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Market Hunter</title>
<style>
:root{
  --bg:#0b0f14;--panel:#111821;--panel2:#151e29;--panel3:#0d141c;
  --text:#f4f7fa;--muted:#8f9baa;--muted2:#6f7c89;--line:#25303c;
  --green:#5dd69e;--amber:#f1c75b;--blue:#67a8ff;--red:#f27b81;
  --shadow:0 12px 34px rgba(0,0,0,.22);--accent:#8ab4ff;--accent2:#75e0b0
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at 15% 0%,rgba(103,168,255,.06),transparent 28%),linear-gradient(180deg,#090d12,#0d131b 50%,#090d12);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh
}
.wrap{max-width:1180px;margin:auto;padding:26px 22px 34px}
header{position:relative;padding:18px 18px 17px;border:1px solid rgba(37,48,60,.78);border-radius:18px;background:linear-gradient(135deg,rgba(21,30,41,.78),rgba(13,20,28,.72));box-shadow:var(--shadow);overflow:hidden}
header:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-100px;top:-160px;background:radial-gradient(circle,rgba(103,168,255,.16),transparent 68%);pointer-events:none}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:14px}
.brand{position:relative;z-index:1}.brand h1{margin:0;font-size:30px;letter-spacing:-.045em;display:flex;align-items:center;gap:10px}.brand h1:before{content:"";width:10px;height:10px;border:2px solid var(--accent2);border-radius:50%;box-shadow:0 0 0 5px rgba(117,224,176,.08)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.control{display:flex;align-items:center;gap:7px;background:rgba(17,24,33,.82);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:12px;min-height:38px}
.control strong{color:var(--text);font-weight:700}
select{background:transparent;color:var(--text);border:0;outline:0;font:inherit;font-weight:700}
button{border:0;border-radius:10px;background:#edf2f7;color:#0c1117;padding:9px 12px;min-height:38px;font-weight:800;cursor:pointer}
.status{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);padding:5px 8px;border-radius:999px;background:rgba(17,24,33,.64);border:1px solid rgba(37,48,60,.75)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(93,214,158,.07)}

.tabs{display:flex;gap:5px;margin:12px 0 20px;padding:5px;background:rgba(13,20,28,.9);border:1px solid var(--line);border-radius:14px;width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.tab{background:transparent;color:var(--muted);padding:8px 14px;min-height:auto;border-radius:9px;font-size:12px}
.tab.active{background:linear-gradient(135deg,#f5f8fb,#dce8f5);color:#0c1117;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.view{display:none}.view.active{display:block}
.hunter-subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:4px;scrollbar-width:none}
.hunter-subtabs::-webkit-scrollbar{display:none}
.hunter-subtab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 11px;min-height:auto;border-radius:999px;font-size:11px}
.hunter-subtab.active{background:rgba(103,168,255,.13);color:#dbeaff;border-color:rgba(103,168,255,.38)}

.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 10px}
.section-title h2{margin:0;font-size:16px;letter-spacing:-.02em}
.section-title p{margin:3px 0 0;color:var(--muted);font-size:11px}
.region{margin-bottom:20px}
.regime-panel{margin:0 0 22px;padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,rgba(21,30,41,.94),rgba(13,20,28,.92));box-shadow:var(--shadow)}
.regime-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}.regime-head h2{margin:0;font-size:16px}.regime-head p{margin:4px 0 0;color:var(--muted);font-size:10px}
.regime-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.regime-card{background:var(--panel3);border:1px solid #202b36;border-radius:12px;padding:11px}
.regime-name{font-size:10px;color:var(--muted);margin-bottom:7px}.regime-state{font-size:14px;font-weight:850}.regime-meta{font-size:9px;color:var(--muted2);margin-top:6px;line-height:1.45}
.regime-state.Strong,.regime-state.Improving{color:var(--green)}.regime-state.Weak,.regime-state.Weakening{color:var(--red)}.regime-state.Mixed{color:var(--amber)}
.regime-note{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.55}
.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:linear-gradient(180deg,rgba(21,30,41,.9),rgba(17,24,33,.9));border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow)}
.metric .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.metric .v{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.035em}
.metric .sub{font-size:11px;margin-top:6px;line-height:1.35}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}

.market-grid{display:grid;grid-template-columns:1.05fr 1.95fr;gap:12px;margin-top:22px}
.market-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.market-card h3{font-size:14px;margin:0 0 4px}
.market-card .hint{color:var(--muted);font-size:10px;margin-bottom:14px}
.breadth-main{display:flex;align-items:flex-end;gap:11px}
.breadth-number{font-size:38px;font-weight:850;letter-spacing:-.05em}
.status-pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;margin-bottom:6px}
.strong{background:rgba(93,214,158,.12);color:var(--green)}
.neutral{background:rgba(241,199,91,.12);color:var(--amber)}
.weak{background:rgba(242,123,129,.12);color:var(--red)}
.breadth-sub{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.55}
.trend-line{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.trend-name{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.trend-value{font-size:12px;font-weight:800}

.sector-list{display:grid;gap:7px}
.sector-row{display:grid;grid-template-columns:1.25fr .7fr .7fr .85fr .8fr;gap:8px;align-items:center;padding:9px 10px;background:var(--panel3);border:1px solid #202b36;border-radius:10px;font-size:11px}
.sector-row.head{background:transparent;border:0;padding:0 10px 5px;color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.sector-name{font-weight:750}
.sector-status{font-size:9px;padding:4px 6px;border-radius:999px;width:max-content;font-weight:800}

.regime-brief{margin:0 0 18px;padding:17px 18px;border:1px solid #2b3948;border-radius:17px;background:linear-gradient(135deg,rgba(103,168,255,.09),rgba(93,214,158,.045));box-shadow:var(--shadow)}
.regime-brief-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px}.regime-brief h2{margin:0;font-size:16px}.regime-date{font-size:10px;color:var(--muted2)}
.regime-sentence{font-size:13px;line-height:1.65;color:#dce5ed;max-width:920px}
.regime-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.regime-chip{padding:9px 10px;border:1px solid rgba(37,48,60,.85);border-radius:11px;background:rgba(11,15,20,.38)}.regime-chip .name{font-size:9px;color:var(--muted2);text-transform:uppercase}.regime-chip .state{font-size:12px;font-weight:800;margin-top:4px}
.takeaway{margin-top:12px;background:linear-gradient(135deg,rgba(103,168,255,.08),rgba(93,214,158,.045));border:1px solid #293746;border-radius:16px;padding:16px}
.takeaway h3{margin:0 0 10px;font-size:14px}
.takeaway-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.take{background:rgba(11,15,20,.45);border:1px solid rgba(37,48,60,.75);border-radius:10px;padding:10px}
.take .k{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em}
.take .v{font-size:12px;font-weight:800;margin-top:4px}

.stage{margin-top:18px}.stage:first-child{margin-top:6px}
.stage-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:0 2px 10px;border-bottom:1px solid rgba(37,48,60,.7);margin-bottom:11px}
.stage-main{display:flex;align-items:center;gap:10px;min-width:0}
.stage-copy{min-width:0}.stage-copy h2{margin:0;font-size:17px;letter-spacing:-.02em}
.stage-copy p{margin:3px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}
.recovery{background:rgba(241,199,91,.12);color:var(--amber)}
.attractive{background:rgba(93,214,158,.12);color:var(--green)}
.established{background:rgba(103,168,255,.12);color:var(--blue)}
.shown{color:var(--muted2);font-size:11px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .16s ease,transform .16s ease}
.card:hover{border-color:#405268;transform:translateY(-2px)}.card:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;border-radius:3px;background:transparent}.card:has(.badge.recovery):before{background:rgba(241,199,91,.75)}.card:has(.badge.attractive):before{background:rgba(93,214,158,.75)}.card:has(.badge.established):before{background:rgba(103,168,255,.75)}
.card-actions{display:flex;align-items:center;gap:6px}
.heart{background:transparent;color:var(--muted);padding:3px 5px;min-height:auto;font-size:20px;line-height:1}
.heart.saved{color:var(--red)}
.tv-link{display:inline-flex;align-items:center;justify-content:center;color:var(--blue);font-size:10px;font-weight:800;text-decoration:none;border:1px solid #2b3c50;border-radius:8px;padding:5px 7px}
.watchlist{margin:0 0 22px}.watchlist .grid{margin-top:10px}
.watch-empty{color:var(--muted);font-size:11px;padding:14px;border:1px dashed var(--line);border-radius:12px}
.remove-hint{display:none;color:var(--muted2);font-size:9px;margin-top:7px}
.watchlist .remove-hint{display:block}
.top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.ticker-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ticker{font-size:21px;font-weight:850;letter-spacing:-.025em}
.company{font-size:12px;color:var(--muted);margin-top:3px}.sector{font-size:10px;color:var(--muted2);margin-top:3px}
.price{text-align:right;font-size:18px;font-weight:800}
.score-pill{display:none;;align-items:center;gap:5px;margin-top:5px;padding:4px 7px;border-radius:999px;background:#0d141c;border:1px solid #22303d;color:var(--muted);font-size:10px;font-weight:700}
.score-pill b{color:var(--text)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}
.mini{background:linear-gradient(180deg,#0d151e,#0b1219);border:1px solid #202b36;border-radius:10px;padding:8px}
.mini .k{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em}.mini .v{font-size:13px;font-weight:780;margin-top:3px}
.why{margin-top:11px;padding:10px 11px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid rgba(37,48,60,.72);color:#d8e0e8;font-size:11.5px;line-height:1.45}
.why strong{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-right:5px}
.score{margin-top:10px;display:flex;align-items:center;gap:8px}.bar{height:5px;background:#202a34;border-radius:999px;overflow:hidden;flex:1}.fill{height:100%;background:linear-gradient(90deg,#7186a0,#dce6f2)}.score small{color:var(--muted2);font-size:10px}
.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.card.open .detail{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pill{border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center;font-size:9px;color:var(--muted)}.pill b{display:block;margin-top:3px;font-size:11px;color:var(--text)}
.signal{border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:9px;color:var(--muted);text-align:left}
.signal b{display:block;margin-top:3px;font-size:11px;color:var(--text);line-height:1.3}
.history-note{display:inline-flex;margin-top:8px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(37,48,60,.8);font-size:9px;font-weight:800}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
footer{color:var(--muted2);font-size:10px;margin:24px 0 6px;line-height:1.5}
.loading{opacity:.65;pointer-events:none}.error{background:rgba(242,123,129,.08);border:1px solid rgba(242,123,129,.3);color:#ffc5c8;padding:12px;border-radius:12px;margin-bottom:14px;display:none}

@media(max-width:900px){
  .index-grid{grid-template-columns:repeat(2,1fr)}
  .market-grid{grid-template-columns:1fr}
  .regime-grid{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr 1fr}
  .takeaway-grid{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .wrap{padding:12px 12px 24px}header{padding:15px 14px;border-radius:16px}header{display:block;margin-bottom:12px}.brand h1{font-size:27px}.brand p{font-size:12px;max-width:340px}
  .toolbar{align-items:stretch;margin-top:12px;gap:7px}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}
  .control{padding:7px 9px;min-height:36px}.control span{display:none}button{padding:8px 11px;min-height:36px;font-size:12px}
  .status{align-self:flex-start;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);position:sticky;top:6px;z-index:20;backdrop-filter:blur(14px)}.tab{width:100%;padding:8px 5px;font-size:10px}
  .index-grid{grid-template-columns:1fr 1fr;gap:9px}.regime-grid{grid-template-columns:1fr 1fr;gap:7px}.regime-panel{padding:13px}.regime-card{padding:9px}.metric{padding:12px}.metric .v{font-size:19px}.metric .sub{font-size:10px}
  .market-grid{grid-template-columns:1fr}.sector-row{grid-template-columns:1.2fr .7fr .7fr .9fr}.sector-row>*:nth-child(4){display:none}.sector-row.head>*:nth-child(4){display:none}
  .takeaway-grid{grid-template-columns:1fr 1fr}.regime-strip{grid-template-columns:1fr 1fr}.regime-brief{padding:14px}.regime-sentence{font-size:12px}
  .grid{grid-template-columns:1fr}.stage{margin-top:20px}.stage-head{grid-template-columns:1fr auto;align-items:center;gap:8px}
  .stage-main{align-items:flex-start;gap:8px}.stage-copy h2{font-size:16px}.stage-copy p{font-size:10px;white-space:normal}
  .badge{font-size:9px;padding:4px 7px;margin-top:1px}.card{padding:14px}.row{grid-template-columns:repeat(5,1fr)}
  .mini{padding:7px 6px}.mini .v{font-size:12px}.detail-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:390px){
  .controls{grid-template-columns:1fr 1fr}#refresh{grid-column:1/-1}
  .row{grid-template-columns:repeat(5,1fr)}
  .mini{padding:6px 3px}.mini .k{font-size:8px}.mini .v{font-size:10px}
  .sector-row{grid-template-columns:1.1fr .65fr .7fr}.sector-row>*:nth-child(5){display:none}.sector-row.head>*:nth-child(5){display:none}
}

.price-structure{margin-top:5px;text-align:right;font-size:11px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.price-structure strong{color:var(--text);font-size:12px}.price-structure .sep{margin:0 3px;opacity:.6}
.price-structure small{display:block;margin-top:2px;font-size:8px;letter-spacing:.04em;opacity:.7}

.sector.sector-strong{color:var(--accent2,#75e0b0)}
.sector.sector-neutral{color:var(--muted)}
.sector.sector-weak{color:#ff7b7b}

.sector-toggle{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:inherit;cursor:pointer}
.sector-name{display:flex;align-items:center;gap:6px}
.sector-count{font-size:10px;min-width:18px;padding:2px 5px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);text-align:center}
.sector-candidates{display:none;padding:4px 10px 10px 14px;border-left:1px solid rgba(255,255,255,.08);margin-left:8px}
.sector-candidates.open{display:block}
.sector-candidate{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;border-top:1px solid rgba(255,255,255,.055)}
.sector-symbol{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--text);padding:0;cursor:pointer}
.sector-symbol span{font-size:10px;color:var(--muted)}
.sector-quick{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--muted)}
.sector-quick .heart{font-size:17px}
.sector-empty{padding:9px 4px;color:var(--muted);font-size:11px}
@media(max-width:650px){.sector-candidate{align-items:flex-start;flex-direction:column}.sector-quick{width:100%;justify-content:space-between}}

.change-list{display:grid;gap:8px}
.change-item{display:grid;grid-template-columns:minmax(110px,.7fr) 2fr auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.change-item>div{display:flex;gap:8px;align-items:center}.change-item>div span{font-size:10px;color:var(--muted)}
.change-item p{margin:0;font-size:12px;color:var(--muted)}.change-item.dropped{border-color:rgba(255,123,123,.2)}
@media(max-width:650px){.change-item{grid-template-columns:1fr auto}.change-item p{grid-column:1/-1;grid-row:2}.tabs .tab{font-size:10px;padding-left:7px;padding-right:7px}}

.sector-sortbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px 4px 6px;color:var(--muted);font-size:10px}.sector-sortbar label{display:flex;flex-direction:column;gap:4px}.sector-sortbar label>span{font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.sector-sort{width:100%;max-width:none;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:var(--text);padding:7px 28px 7px 9px;font-size:11px}

@media(max-width:650px){.sector-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:7px 10px;align-items:center}.sector-quick .heart{grid-column:4;grid-row:1/3;align-self:center}}

.sector-quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:5px;align-items:center;width:min(100%,540px)}
.mini-metric{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:center}
.mini-metric small{font-size:8px;letter-spacing:.08em;color:var(--muted);line-height:1}
.mini-metric b{font-size:11px;font-weight:650;white-space:nowrap}
@media(max-width:650px){
  .sector-candidate{width:100%;gap:8px}
  .sector-quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 30px;width:100%;gap:3px}
  .sector-quick .heart{grid-column:6;grid-row:1;align-self:center;justify-self:end}
  .mini-metric small{font-size:7px}.mini-metric b{font-size:10px}
}

.compare-pick{width:25px;height:25px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0}.compare-pick.selected{color:var(--accent2);background:transparent}
.compare-dock{display:none;position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,calc(100% - 28px));justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:#111b25;box-shadow:0 14px 45px rgba(0,0,0,.35)}.compare-dock.show{display:flex}.compare-dock>div{display:flex;flex-direction:column;gap:2px}.compare-dock span{font-size:10px;color:var(--muted)}.compare-dock button{border:0;border-radius:10px;padding:9px 13px;font-weight:700}.compare-dock button:disabled{opacity:.4}
.compare-modal{display:none;position:fixed;z-index:50;inset:0;background:rgba(3,8,13,.72);padding:18px;overflow:auto}.compare-modal.show{display:flex;align-items:flex-start;justify-content:center}.compare-sheet{margin:auto;width:min(760px,100%);background:#111b25;border:1px solid var(--line);border-radius:18px;padding:16px}.compare-head{display:flex;justify-content:space-between;align-items:flex-start}.compare-head h2,.compare-head p{margin:0}.compare-head p{font-size:11px;color:var(--muted);margin-top:3px}.compare-head button{border:0;background:transparent;color:var(--text);font-size:28px}.compare-table{margin-top:14px;overflow-x:auto}.compare-row{display:grid;grid-template-columns:110px repeat(3,minmax(110px,1fr));border-top:1px solid var(--line);min-width:450px}.compare-row>div{padding:9px 7px;font-size:11px}.compare-row>div:first-child{color:var(--muted)}.compare-symbols{border-top:0}.compare-symbols small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
@media(max-width:650px){.sector-quick{grid-template-columns:repeat(5,minmax(0,1fr)) 26px 30px}.sector-quick .compare-pick{grid-column:6}.sector-quick .heart{grid-column:7}.compare-dock{bottom:76px}.compare-sheet{padding:12px}.compare-row{grid-template-columns:90px repeat(3,minmax(95px,1fr))}}

.sector-symbol .session-move{font-size:10px;font-weight:700;white-space:nowrap}
.sector-symbol .session-move.up{color:var(--accent2,#75e0b0)}
.sector-symbol .session-move.down{color:#ff7b7b}
.sector-symbol .session-move.flat{color:var(--muted)}
.sector-quick .compare-pick{border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;border-radius:0!important}

.sector-candidate{cursor:pointer}
.sector-candidate-main{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.sector-detail{display:none;width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:3px;padding:9px 0 2px;border-top:1px dashed rgba(255,255,255,.07)}
.sector-candidate.expanded .sector-detail{display:grid}
.sector-detail>div{min-width:0}.sector-detail small{display:block;font-size:8px;color:var(--muted);margin-bottom:2px}.sector-detail b{font-size:10px;font-weight:600;overflow-wrap:anywhere}
@media(max-width:650px){.sector-candidate-main{display:block}.sector-detail{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 7px}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <div class="brand">
    <h1>Market Hunter</h1>
    <p>Objective market scan · fewer charts, less noise, less bias.</p>
  </div>
  <div class="toolbar">
    <div class="controls">
      <label class="control"><span>Show</span><strong>Top</strong><select id="topN"><option selected>3</option><option>5</option></select></label>
      <label class="control"><span>Min $ volume</span><strong>Liquidity</strong><select id="liq"><option value="2000000">$2M</option><option value="5000000" selected>$5M</option><option value="10000000">$10M</option><option value="25000000">$25M</option></select></label>
      <button id="refresh">Refresh</button>
    </div>
    <div class="status" id="status"><span class="dot"></span>Waiting for scan</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="market">Market</button>
  <button class="tab" data-tab="top5">Daily 10 <span style="opacity:.55">★</span></button>
  <button class="tab" data-tab="changes">Changes</button>
  <button class="tab" data-tab="watchlist">Watchlist</button>
</div>

<div class="error" id="error"></div>

<section id="marketView" class="view active">
  <div id="marketContent"></div>
</section>

<section id="top5View" class="view">
  <div id="top5Content"></div>
</section>
<section id="changesView" class="view"><div id="changesContent"></div></section>
<section id="hunterView" class="view">
  <div class="hunter-subtabs" id="hunterSubtabs"></div>
  <div id="stages"></div>
</section>
<section id="watchlistView" class="view">
  <div id="watchlistContent"></div>
</section>


<div id="compareDock" class="compare-dock"></div>
<div id="compareModal" class="compare-modal"></div>
<footer>Discovery dashboard only — not a buy/sell signal. Market context and candidate stages are designed to reduce what you need to inspect manually.</footer>
</div>

<script>
const savedWatch=()=>{try{return new Set(JSON.parse(localStorage.getItem('marketHunterWatchlist')||'[]'))}catch{return new Set()}};
const state={data:null,history:[],tab:'market',hunterStage:'Early Watch',expanded:new Set(),watchlist:savedWatch(),compare:new Set()};
function persistWatch(){localStorage.setItem('marketHunterWatchlist',JSON.stringify([...state.watchlist]))}
function toggleWatch(symbol){
  state.watchlist.has(symbol)?state.watchlist.delete(symbol):state.watchlist.add(symbol);
  persistWatch();
  renderTop5();renderHunter();renderWatchlist();
}
function tradingViewSymbol(symbol){
  const clean=symbol.replace(/\.(TO|V)$/,'');
  return (symbol.endsWith('.V')?'TSXV:':'TSX:')+clean;
}
function openTradingView(symbol){
  const tvSymbol=tradingViewSymbol(symbol);
  const web='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(tvSymbol);
  window.open(web,'_blank','noopener');
}
const fmt=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2}):'—';
const pct=n=>Number.isFinite(n)?`${n>0?'+':''}${n.toFixed(1)}%`:'—';
const cls=n=>n>0?'up':n<0?'down':'flat';
const statusClass=s=>s==='Strong'?'strong':s==='Weak'?'weak':'neutral';
function previousSnapshot(){
  const snaps=(state.history?.snapshots||[]).filter(s=>s.version===state.data?.version&&s.minDollar===state.data?.minDollar&&s.marketAsOf&&s.marketAsOf<state.data?.marketAsOf);
  return snaps.length?snaps[snaps.length-1]:null;
}
function historyNote(x){
  const snap=previousSnapshot();
  if(!snap) return '';
  const prev=(snap.items||[]).find(i=>i.symbol===x.symbol);
  if(!prev) return '<span class="history-note up">New candidate</span>';
  const parts=[];
  if(prev.stage&&prev.stage!==x.stage) parts.push(`${prev.stage} → ${x.stage}`);
  if(!parts.length) return '';
  return `<span class="history-note flat">${parts.join(' · ')}</span>`;
}

function indexCard(name,obj){
  if(!obj)return `<div class="metric"><div class="k">${name}</div><div class="v">—</div><div class="sub flat">Unavailable</div></div>`;
  return `<div class="metric"><div class="k">${name}</div><div class="v">${fmt(obj.price)}</div><div class="sub ${cls(obj.ret5)}">5D ${pct(obj.ret5)} · 20D ${pct(obj.ret20)}</div></div>`;
}

function toggleCompare(symbol){
  if(state.compare.has(symbol)) state.compare.delete(symbol);
  else{
    if(state.compare.size>=3){alert('Compare supports up to 3 stocks.');return}
    state.compare.add(symbol);
  }
  renderMarket();renderCompareDock();
}
function renderCompareDock(){
  const dock=document.querySelector('#compareDock');if(!dock)return;
  const xs=[...state.compare];
  if(!xs.length){dock.classList.remove('show');dock.innerHTML='';return}
  dock.classList.add('show');
  dock.innerHTML=`<div><b>Compare</b><span>${xs.map(x=>x.replace(/\\.(TO|NE|V)$/,'')).join(' · ')}</span></div><button ${xs.length<2?'disabled':''} id="openCompare">Compare ${xs.length}</button>`;
  document.querySelector('#openCompare')?.addEventListener('click',renderCompareModal);
}
function renderCompareModal(){
  const modal=document.querySelector('#compareModal');
  const by=new Map(allHunterCandidates().map(x=>[x.symbol,x]));
  const xs=[...state.compare].map(x=>by.get(x)).filter(Boolean);
  if(xs.length<2)return;
  const metrics=[
    ['Stage',x=>x.stage,''],['5D',x=>pct(x.ret5),x=>cls(x.ret5)],['20D',x=>pct(x.ret20),x=>cls(x.ret20)],
    ['60D',x=>pct(x.ret60),x=>cls(x.ret60)],['Momentum',x=>Number.isFinite(x.momentumShift)?(x.momentumShift>0?'+':'')+x.momentumShift.toFixed(1)+'pp':'—',x=>cls(x.momentumShift)],
    ['RSI 14',x=>Number.isFinite(x.rsi14)?x.rsi14.toFixed(1):'—',''],['VOL 5D',x=>Number.isFinite(x.max5Rvol)?fmt(x.max5Rvol)+'×':'—',''],['RVOL Today',x=>Number.isFinite(x.rvol)?fmt(x.rvol)+'×':'—',''],
    ['Relative 20D',x=>pct(x.rs20),x=>cls(x.rs20)],['Sector',x=>(x.sectorStrength||'—')+(Number.isFinite(x.sectorBreadth)?' · '+x.sectorBreadth+'%':''),''],
    ['Pullback',x=>pct(x.pullback),x=>cls(x.pullback)],['vs MA20',x=>pct(x.dist20),x=>cls(x.dist20)],['vs MA50',x=>pct(x.dist50),x=>cls(x.dist50)],
    ['Local high',x=>(Number.isFinite(x.localHigh)?fmt(x.localHigh)+' · ':'')+(x.highState||'—'),''],['Local low',x=>(Number.isFinite(x.localLow)?fmt(x.localLow)+' · ':'')+(x.lowState||'—'),'']
  ];
  modal.innerHTML=`<div class="compare-sheet"><div class="compare-head"><div><h2>Compare</h2><p>Side-by-side technical context · no winner score</p></div><button id="closeCompare">×</button></div>
  <div class="compare-table"><div class="compare-row compare-symbols"><div>Metric</div>${xs.map(x=>`<div><b>${x.symbol.replace(/\\.(TO|NE|V)$/,'')}</b><small>${x.sector}</small></div>`).join('')}</div>
  ${metrics.map(([label,val,c])=>`<div class="compare-row"><div>${label}</div>${xs.map(x=>`<div class="${typeof c==='function'?c(x):''}">${val(x)}</div>`).join('')}</div>`).join('')}</div></div>`;
  modal.classList.add('show');
  document.querySelector('#closeCompare').addEventListener('click',()=>modal.classList.remove('show'));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
}
function renderMarket(){
  const d=state.data;if(!d)return;
  const canada=['TSX','TSX Venture'];
  const usa=['S&P 500','Nasdaq','Dow Jones','Russell 2000'];
  const b=d.breadth;
  const trendArrow=b.trend==='Improving'?'↑':b.trend==='Weakening'?'↓':'→';
  const trendCls=b.trend==='Improving'?'up':b.trend==='Weakening'?'down':'flat';

  const currentSectorCandidates=[
    ...(d.items||[]),
    ...(d.watchItems||[]).map(x=>({...x,stage:'Early Watch'}))
  ];
  const sectorCandidateRow=x=>`<div class="sector-candidate" data-sector-card="${x.symbol}">
  <div class="sector-candidate-main">
    <button type="button" class="sector-symbol" data-tv="${x.symbol}"><b>${x.symbol.replace(/\\.(TO|NE|V)$/,'')}</b><span>${x.stage}</span><strong class="session-move ${cls(x.latestDayReturn)}">${Number.isFinite(x.latestDayReturn)?(x.latestDayReturn>0?'+':'')+x.latestDayReturn.toFixed(1)+'%':'—'}</strong></button>
    <div class="sector-quick"><span class="mini-metric"><small>5D</small><b class="${cls(x.ret5)}">${pct(x.ret5)}</b></span><span class="mini-metric"><small>20D</small><b class="${cls(x.ret20)}">${pct(x.ret20)}</b></span><span class="mini-metric"><small>MOM</small><b class="${cls(x.momentumShift)}">${Number.isFinite(x.momentumShift)?(x.momentumShift>0?'+':'')+x.momentumShift.toFixed(1)+'pp':'—'}</b></span><span class="mini-metric"><small>RSI</small><b>${Number.isFinite(x.rsi14)?x.rsi14.toFixed(1):'—'}</b></span><span class="mini-metric"><small>VOL 5D</small><b>${Number.isFinite(x.max5Rvol)?fmt(x.max5Rvol)+'×':'—'}</b></span><button class="compare-pick ${state.compare.has(x.symbol)?'selected':''}" data-compare="${x.symbol}" title="Compare">${state.compare.has(x.symbol)?'✓':'＋'}</button><button class="heart ${state.watchlist.has(x.symbol)?'saved':''}" data-watch="${x.symbol}">${state.watchlist.has(x.symbol)?'♥':'♡'}</button></div>
  </div>
  <div class="sector-detail">
    <div><small>60D</small><b class="${cls(x.ret60)}">${pct(x.ret60)}</b></div>
    <div><small>Pullback</small><b class="${cls(x.pullback)}">${pct(x.pullback)}</b></div>
    <div><small>vs MA20</small><b class="${cls(x.dist20)}">${pct(x.dist20)}</b></div>
    <div><small>vs MA50</small><b class="${cls(x.dist50)}">${pct(x.dist50)}</b></div>
    <div><small>Relative 20D</small><b class="${cls(x.rs20)}">${pct(x.rs20)}</b></div>
    <div><small>vs Sector</small><b class="${cls(x.sectorRelative20)}">${pct(x.sectorRelative20)}</b></div>
    <div><small>Sector</small><b>${x.sectorStrength||'—'}</b></div>
    <div><small>RVOL Today</small><b>${Number.isFinite(x.rvol)?fmt(x.rvol)+'×':'—'}</b></div>
    <div><small>Volume day</small><b>${x.unusual5dDirection||'—'}</b></div>
    <div><small>Local High</small><b>${Number.isFinite(x.localHigh)?fmt(x.localHigh):'—'} · ${x.highState||'—'}</b></div>
    <div><small>Local Low</small><b>${Number.isFinite(x.localLow)?fmt(x.localLow):'—'} · ${x.lowState||'—'}</b></div>
  </div>
</div>`;
  const sectors=(d.sectors||[]).map(sec=>{
    const names=currentSectorCandidates.filter(x=>x.sector===sec.sector);
    const key=encodeURIComponent(sec.sector);
    return `
      <div class="sector-block">
        <button class="sector-row sector-toggle" type="button" data-sector="${sec.sector}">
          <div class="sector-name">${sec.sector}<span class="sector-count">${names.length}</span></div>
          <div class="${cls(sec.ret5)}">${pct(sec.ret5)}</div>
          <div class="${cls(sec.ret20)}">${pct(sec.ret20)}</div>
          <div>${sec.breadth??'—'}%</div>
          <div><span class="sector-status ${statusClass(sec.breadthStatus)}">${sec.trend}</span></div>
        </button>
        <div class="sector-candidates" data-sector-list="${sec.sector}">
          ${names.length?`<div class="sector-sortbar"><label><span>Sort 1</span><select class="sector-sort sector-sort-primary" data-sector-key="${key}">
            <option value="ret5:desc">5D · Highest</option><option value="ret5:asc">5D · Lowest</option>
            <option value="ret20:desc">20D · Highest</option><option value="ret20:asc">20D · Lowest</option>
            <option value="max5Rvol:desc">VOL 5D · Highest</option><option value="max5Rvol:asc">VOL 5D · Lowest</option>
            <option value="rsi14:desc">RSI · Highest</option><option value="rsi14:asc">RSI · Lowest</option>
            <option value="momentumShift:desc">Momentum · Highest</option><option value="momentumShift:asc">Momentum · Lowest</option>
            <option value="rs20:desc">Relative Strength · Highest</option><option value="rs20:asc">Relative Strength · Lowest</option>
            <option value="pullback:desc">Pullback · Nearest high</option><option value="pullback:asc">Pullback · Deepest</option>
          </select></label><label><span>Sort 2</span><select class="sector-sort sector-sort-secondary" data-sector-key="${key}">
            <option value="none">None</option><option value="ret5:desc">5D · Highest</option><option value="ret5:asc">5D · Lowest</option>
            <option value="ret20:desc">20D · Highest</option><option value="ret20:asc">20D · Lowest</option>
            <option value="max5Rvol:desc">VOL 5D · Highest</option><option value="max5Rvol:asc">VOL 5D · Lowest</option>
            <option value="rsi14:desc">RSI · Highest</option><option value="rsi14:asc">RSI · Lowest</option>
            <option value="momentumShift:desc">Momentum · Highest</option><option value="momentumShift:asc">Momentum · Lowest</option>
            <option value="rs20:desc">Relative Strength · Highest</option><option value="rs20:asc">Relative Strength · Lowest</option>
            <option value="pullback:desc">Pullback · Nearest high</option><option value="pullback:asc">Pullback · Deepest</option>
          </select></label></div><div class="sector-candidate-rows" data-sector-rows="${key}">${names.map(sectorCandidateRow).join('')}</div>`:`<div class="sector-empty">No current Hunter candidates in this sector.</div>`}
        </div>
      </div>`;
  }).join('');

  const mc=d.marketContext||{};
  const regimes=d.marketRegimes||{};
  const regimeNames=['TSX','Nasdaq','S&P 500','TSX Venture'];
  const regimeClass=r=>r==='Strong'||r==='Improving'?'up':r==='Weak'||r==='Weakening'?'down':'flat';
  const regimeCards=regimeNames.map(name=>{
    const r=regimes[name];
    if(!r) return `<div class="regime-card"><div class="regime-name">${name}</div><div class="regime-state Mixed">—</div><div class="regime-meta">Unavailable</div></div>`;
    const arrow=r.regime==='Strong'||r.regime==='Improving'?'↑':r.regime==='Weak'||r.regime==='Weakening'?'↓':'→';
    return `<div class="regime-card"><div class="regime-name">${name}</div><div class="regime-state ${r.regime}">${r.regime} ${arrow}</div><div class="regime-meta">5D ${pct(r.ret5)} · 20D ${pct(r.ret20)}<br>MA20 ${r.above20?'above':'below'} · MA50 ${r.above50?'above':'below'}</div></div>`;
  }).join('');
  const narrative=mc.narrative||'Market regime is based on trend and recent index momentum.';

  document.querySelector('#marketContent').innerHTML=`
    <div class="regime-brief">
      <div class="regime-brief-top"><h2>Today's Market Read</h2><span class="regime-date">Market data · ${d.marketAsOf||'—'}</span></div>
      <div class="regime-sentence">${mc.narrative||'Market summary is not available yet.'}</div>
      <div class="regime-strip">${regimeNames.map(name=>`<div class="regime-chip"><div class="name">${name}</div><div class="state ${regimeClass(regimes[name]?.regime)}">${regimes[name]?.regime||'—'}</div></div>`).join('')}</div>
    </div>

    <div class="regime-panel">
      <div class="regime-head"><div><h2>Today’s Market Regime</h2><p>Quick context before opening individual charts</p></div><span class="shown">${d.marketAsOf||''}</span></div>
      <div class="regime-grid">${regimeCards}</div>
      <div class="regime-note">${narrative}</div>
    </div>

    <div class="region">
      <div class="section-title"><div><h2>Canada</h2><p>Major Canadian equity indexes</p></div></div>
      <div class="index-grid">${canada.map(n=>indexCard(n,d.indexes[n])).join('')}</div>
    </div>

    <div class="region">
      <div class="section-title"><div><h2>United States</h2><p>Large-cap, technology and broader market indexes</p></div></div>
      <div class="index-grid">${usa.map(n=>indexCard(n,d.indexes[n])).join('')}</div>
    </div>

    <div class="market-grid">
      <div class="market-card">
        <h3>Market Breadth</h3>
        <div class="hint">Canadian names above MA50 · fixed C$2M liquidity universe</div>
        <div class="breadth-main">
          <div class="breadth-number">${b.percentAbove50??'—'}%</div>
          <span class="status-pill ${statusClass(b.status)}">${b.status}</span>
        </div>
        <div class="breadth-sub">
          5 days ago: <b>${b.percentAbove50Prev5??'—'}%</b><br>
          Advancers / Decliners (5D): <b>${b.advancers5d} / ${b.decliners5d}</b>
        </div>
        <div class="trend-line">
          <span class="trend-name">Breadth trend</span>
          <span class="trend-value ${trendCls}">${trendArrow} ${b.trend} ${Number.isFinite(b.change5d)?'('+b.change5d+' pp)' :''}</span>
        </div>
      </div>

      <div class="market-card">
        <h3>Sector Snapshot</h3>
        <div class="hint">Based on the liquid names currently inside Hunter's Canadian universe</div>
        <div class="sector-list">
          <div class="sector-row head"><div>Sector</div><div>5D</div><div>20D</div><div>Breadth</div><div>Trend</div></div>
          ${sectors}
        </div>
      </div>
    </div>

    <div class="takeaway">
      <h3>Market Takeaway</h3>
      <div class="takeaway-grid">
        <div class="take"><div class="k">Canada 20D</div><div class="v ${cls(mc.canada20)}">${pct(mc.canada20)}</div></div>
        <div class="take"><div class="k">USA 20D</div><div class="v ${cls(mc.usa20)}">${pct(mc.usa20)}</div></div>
        <div class="take"><div class="k">Breadth</div><div class="v">${mc.breadthStatus||'—'} · ${mc.breadthTrend||'—'}</div></div>
        <div class="take"><div class="k">Leading sector</div><div class="v">${mc.strongestSector||'—'}</div></div>
      </div>
    </div>
  `;
  document.querySelectorAll('#marketContent .sector-toggle').forEach(el=>el.addEventListener('click',()=>{
    const list=document.querySelector('#marketContent [data-sector-list="'+el.dataset.sector+'"]');
    if(list) list.classList.toggle('open');
  }));
  document.querySelectorAll('#marketContent .sector-sort').forEach(sel=>sel.addEventListener('change',()=>{
    const key=sel.dataset.sectorKey;
    const sector=decodeURIComponent(key);
    const rows=document.querySelector('#marketContent [data-sector-rows="'+key+'"]');
    if(!rows)return;
    const primary=document.querySelector('#marketContent .sector-sort-primary[data-sector-key="'+key+'"]')?.value||'ret5:desc';
    const secondary=document.querySelector('#marketContent .sector-sort-secondary[data-sector-key="'+key+'"]')?.value||'none';
    const parse=v=>v==='none'?null:v.split(':');
    const p=parse(primary),q=parse(secondary);
    const cmp=(a,b,spec)=>{
      if(!spec)return 0;
      const [field,dir]=spec,av=a[field],bv=b[field];
      if(!Number.isFinite(av)&&!Number.isFinite(bv))return 0;
      if(!Number.isFinite(av))return 1;if(!Number.isFinite(bv))return -1;
      return dir==='asc'?av-bv:bv-av;
    };
    const names=currentSectorCandidates.filter(x=>x.sector===sector).sort((a,b)=>cmp(a,b,p)||cmp(a,b,q)||a.symbol.localeCompare(b.symbol));
    rows.innerHTML=names.map(sectorCandidateRow).join('');
    document.querySelectorAll('#marketContent [data-sector-rows="'+sel.dataset.sectorKey+'"] .compare-pick').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleCompare(el.dataset.compare)}));
    document.querySelectorAll('#marketContent [data-sector-rows="'+sel.dataset.sectorKey+'"] .heart').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleWatch(el.dataset.watch)}));
    document.querySelectorAll('#marketContent [data-sector-rows="'+sel.dataset.sectorKey+'"] .sector-symbol').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openTradingView(el.dataset.tv)}));
  }));
  document.querySelectorAll('#marketContent .sector-candidates .compare-pick').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleCompare(el.dataset.compare)}));
  document.querySelectorAll('#marketContent .sector-candidates .heart').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleWatch(el.dataset.watch)}));
  document.querySelectorAll('#marketContent .sector-symbol').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openTradingView(el.dataset.tv)}));
  document.querySelectorAll('#marketContent .sector-candidate').forEach(card=>card.addEventListener('click',e=>{
    if(e.target.closest('.sector-symbol,.compare-pick,.heart'))return;
    card.classList.toggle('expanded');
  }));
}

function renderWatchlist(){
  const d=state.data;if(!d)return;
  const current=[...(d.items||[]),...(d.watchItems||[])];
  const currentSymbols=new Set(current.map(x=>x.symbol));
  const bySymbol=new Map([...(d.availableItems||[]),...current].map(x=>[x.symbol,x]));
  const failures=new Map((d.failureDetails||[]).map(x=>[x.symbol,x.reason]));
  const watched=[...state.watchlist].map(symbol=>{
    const item=bySymbol.get(symbol);
    if(item) return {...item,watchStatus:currentSymbols.has(symbol)?null:'خارج از فهرست فعلی'};
    return {symbol,company:symbol,sector:'Saved chart',watchStatus:'داده فعلاً در دسترس نیست',unavailableReason:failures.get(symbol)||'not_in_current_scan'};
  });
  document.querySelector('#watchlistContent').innerHTML=`
    <section class="watchlist">
      <div class="section-title"><div><h2>♥ Watchlist</h2><p>Your saved charts stay here even when they leave the current scan · swipe left on mobile to remove</p></div><span class="shown">${watched.length}</span></div>
      <div class="grid">${watched.length?watched.map(x=>x.unavailableReason?unavailableWatchCard(x):card(x,(x.stage==='Established Move'?'established':x.stage==='Attractive Growth'?'attractive':'recovery'),x.stage||'Watchlist',true)).join(''):'<div class="watch-empty">No saved names yet. Tap ♡ on a Hunter candidate to add it.</div>'}</div>
    </section>`;
  bindCardActions('#watchlistContent');
}
function unavailableWatchCard(x){
  const ticker=x.symbol.replace(/\.(TO|NE|V)$/,'');
  return `<article class="card">
    <div class="top"><div><div class="ticker-line"><div class="ticker">${ticker}</div><span class="badge recovery">Watchlist</span></div><div class="company">${x.company}</div><div class="sector">داده فعلاً در دسترس نیست · ${x.unavailableReason}</div></div>
    <div class="card-actions"><button class="heart saved" data-watch="${x.symbol}" title="Watchlist">♥</button><button class="tv-link" type="button" data-tv="${x.symbol}" title="Open in TradingView">Chart ↗</button></div></div>
    <div class="why"><strong>Saved status</strong>نماد ذخیره‌شده باقی مانده و با برگشت داده دوباره کامل نمایش داده می‌شود.</div>
    <div class="remove-hint">Swipe left to remove</div>
  </article>`;
}
function bindCardActions(root=''){
  document.querySelectorAll(root+' .card').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('open')));
  document.querySelectorAll(root+' .heart').forEach(el=>{
    const act=e=>{e.preventDefault();e.stopPropagation();toggleWatch(el.dataset.watch)};
    el.addEventListener('click',act);
    el.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();toggleWatch(el.dataset.watch)},{passive:false});
  });
  document.querySelectorAll(root+' .tv-link').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openTradingView(el.dataset.tv)}));
  document.querySelectorAll(root+' .watchlist .card').forEach(el=>{
    let startX=null;
    el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});
    el.addEventListener('touchend',e=>{
      if(startX===null)return;
      const dx=e.changedTouches[0].clientX-startX;startX=null;
      if(dx<-55){const symbol=el.querySelector('.heart')?.dataset.watch;if(symbol){state.watchlist.delete(symbol);persistWatch();renderHunter();renderWatchlist()}}
    },{passive:true});
  });
}
function stageKind(x){return x.stage==='Established Move'?'established':x.stage==='Attractive Growth'?'attractive':'recovery'}
function allHunterCandidates(){
  const d=state.data;if(!d)return [];
  return [...(d.items||[]),...(d.watchItems||[]).map(x=>({...x,stage:'Early Watch'}))];
}
function previousCandidateMap(){
  const snap=previousSnapshot();
  const map=new Map();
  if(!snap)return map;
  for(const x of [...(snap.items||[]),...(snap.earlyWatch||[])]) map.set(x.symbol,x);
  return map;
}
function changeReasons(x,prev){
  const reasons=[];
  if(!prev) return reasons; // merely entering the candidate list is not a suspicious event
  if(prev.stage&&prev.stage!==x.stage) reasons.push(`STAGE · ${prev.stage} → ${x.stage}`);
  if(Number.isFinite(prev.momentumShift)&&Number.isFinite(x.momentumShift)){
    const d=x.momentumShift-prev.momentumShift;
    if(d>=3) reasons.push(`Momentum improved ${d.toFixed(1)}pp`);
    else if(d<=-3) reasons.push(`Momentum weakened ${Math.abs(d).toFixed(1)}pp`);
  }
  if(prev.highState!==x.highState&&x.highState==='local_high_broken') reasons.push('Local high broken');
  if(prev.lowState!==x.lowState&&x.lowState==='failed_low_break') reasons.push('Local low reclaimed');
  if(prev.lowState!==x.lowState&&x.lowState==='local_low_broken') reasons.push('Local low broken');
  if(Number.isFinite(x.rvol)&&x.rvol>=1.4&&(!Number.isFinite(prev.rvol)||prev.rvol<1.4)) reasons.push(`Unusual volume appeared · ${x.rvol.toFixed(1)}×`);
  return reasons;
}
function renderTop5(){
  const d=state.data;if(!d)return;
  const prevMap=previousCandidateMap();
  const pool=allHunterCandidates().map(x=>({...x,crossStageScore:Number.isFinite(x.crossStageScore)?x.crossStageScore:null}));
  const backendRank=new Map((d.top5||[]).map(x=>[x.symbol,x.crossStageScore]));
  pool.forEach(x=>{if(backendRank.has(x.symbol))x.crossStageScore=backendRank.get(x.symbol)});
  const xs=pool.map(x=>({...x,_reasons:changeReasons(x,prevMap.get(x.symbol))}))
    .sort((a,b)=>{
      const ac=a._reasons.length?1:0,bc=b._reasons.length?1:0;
      if(ac!==bc)return bc-ac;
      return (b.score??-Infinity)-(a.score??-Infinity)||a.symbol.localeCompare(b.symbol);
    }).slice(0,10);
  document.querySelector('#top5Content').innerHTML=`
    <section class="stage">
      <div class="stage-head"><div class="stage-main"><div class="stage-copy">
        <h2>Daily 10</h2>
        <p>Ten charts to review first today. Fresh technical changes are prioritized; this is not a BUY signal.</p>
      </div></div><span class="shown">${xs.length}</span></div>
      <div class="grid">${xs.length?xs.map(x=>card({...x,why:x._reasons.length?x._reasons:(x.why||[])},stageKind(x),x.stage)).join(''):'<div class="empty">No candidates available.</div>'}</div>
    </section>`;
  bindCardActions('#top5Content');
}
function renderChanges(){
  const d=state.data;if(!d)return;
  const prev=previousSnapshot();
  const current=allHunterCandidates();
  const currentMap=new Map(current.map(x=>[x.symbol,x]));
  const prevItems=prev?[...(prev.items||[]),...(prev.earlyWatch||[])]:[];
  const prevMap=new Map(prevItems.map(x=>[x.symbol,x]));
  const changed=current.map(x=>({...x,_reasons:changeReasons(x,prevMap.get(x.symbol))})).filter(x=>x._reasons.length);
  const rows=changed;
  document.querySelector('#changesContent').innerHTML=`
    <section class="stage">
      <div class="stage-head"><div class="stage-main"><div class="stage-copy"><h2>Changes</h2><p>Only unusual behavior changes since the previous saved session: stage shifts, momentum turns, structure breaks/reclaims, or newly unusual volume.</p></div></div><span class="shown">${rows.length}</span></div>
      <div class="change-list">${rows.length?rows.map(x=>`<div class="change-item ${x._dropped?'dropped':''}"><div><b>${x.symbol.replace(/\\.(TO|NE|V)$/,'')}</b><span>${x.stage||'Exited'}</span></div><p>${x._reasons.join(' · ')}</p><button type="button" class="tv-link" data-tv="${x.symbol}">Chart ↗</button></div>`).join(''):'<div class="empty">No material changes detected versus the previous saved session.</div>'}</div>
    </section>`;
  document.querySelectorAll('#changesContent .tv-link').forEach(el=>el.addEventListener('click',()=>openTradingView(el.dataset.tv)));
}

function renderHunter(){
  const d=state.data;if(!d)return;
  const top=+document.querySelector('#topN').value;
  const defs=[
    ['Early Watch','recovery','شکار قبل از برگشت','Still weak, but Hunter sees an early change. Reversal is not confirmed.'],
    ['Recovery','recovery','مشکوک به تغییر / ریکاوری','Rebounding after a meaningful decline, with price back at or above MA20.'],
    ['Attractive Growth','attractive','در حال رشد ولی جذاب','Trend is constructive and still worth a chart check.'],
    ['Established Move','established','رشد کرده','A clearer, more mature move that remains on radar.']
  ];
  document.querySelector('#hunterSubtabs').innerHTML=defs.map(([name])=>`<button class="hunter-subtab ${state.hunterStage===name?'active':''}" data-stage-tab="${name}">${name}</button>`).join('');
  const def=defs.find(x=>x[0]===state.hunterStage)||defs[0];
  const [name,kind,fa,sub]=def;
  const all=name==='Early Watch'?(d.watchItems||[]):d.items.filter(x=>x.stage===name);
  const expanded=state.expanded.has(name);
  const xs=expanded?all:all.slice(0,top);
  document.querySelector('#stages').innerHTML=`
    <section class="stage">
      <div class="stage-head">
        <div class="stage-main"><span class="badge ${kind}">${fa}</span>
          <div class="stage-copy"><h2>${name}</h2><p>${sub}</p><p>Ordered for chart review using technical conditions; not a probability of gain.</p></div>
        </div><span class="shown">${xs.length} of ${all.length}</span>
      </div>
      <div class="grid">${xs.length?xs.map(x=>card(x,kind,fa)).join(''):'<div class="empty">No names passed this stage at the current liquidity threshold.</div>'}</div>
      ${all.length>top?`<button class="show-more" data-stage="${name}" aria-expanded="${expanded}">${expanded?'Show top '+top:'Show all '+all.length}</button>`:''}
    </section>`;
  document.querySelectorAll('.hunter-subtab').forEach(el=>el.addEventListener('click',()=>{state.hunterStage=el.dataset.stageTab;state.expanded.clear();renderHunter()}));
  document.querySelectorAll('.show-more').forEach(el=>el.addEventListener('click',()=>{const n=el.dataset.stage;if(state.expanded.has(n))state.expanded.delete(n);else state.expanded.add(n);renderHunter()}));
  bindCardActions('#stages');
}

function card(x,kind,fa,inWatch=false){
  const q=n=>`<span class="${cls(n)}">${pct(n)}</span>`;
  const ticker=x.symbol.replace(/\.(TO|NE|V)$/,'');
  return `
    <article class="card">
      <div class="top">
        <div>
          <div class="ticker-line"><div class="ticker">${ticker}</div><span class="badge ${kind}">${fa}</span></div>
          <div class="company">${x.company}</div><div class="sector ${x.sectorStrength==='Strong'?'sector-strong':x.sectorStrength==='Weak'?'sector-weak':'sector-neutral'}">${x.sector}</div>${x.watchStatus?`<span class="history-note flat">${x.watchStatus}</span>`:''}${historyNote(x)}
        </div>
        <div>
          <div class="card-actions">
            <button class="heart ${state.watchlist.has(x.symbol)?'saved':''}" data-watch="${x.symbol}" title="Watchlist">${state.watchlist.has(x.symbol)?'♥':'♡'}</button>
            <button class="tv-link" type="button" data-tv="${x.symbol}" title="Open in TradingView">Chart ↗</button>
          </div>
          ${Number.isFinite(x.localLow)&&Number.isFinite(x.price)&&Number.isFinite(x.localHigh)?`<div class="price-structure"><span>${fmt(x.localLow)}</span><span class="sep">&lt;</span><strong>${fmt(x.price)}</strong><span class="sep">&lt;</span><span>${fmt(x.localHigh)}</span><small>Low · Current · High</small></div>`:`<div class="price">${fmt(x.price)}</div>`}
        </div>
      </div>
      <div class="row">
        <div class="mini"><div class="k">5D</div><div class="v">${q(x.ret5)}</div></div>
        <div class="mini"><div class="k">20D</div><div class="v">${q(x.ret20)}</div></div>
        <div class="mini"><div class="k">MOM</div><div class="v ${cls(x.momentumShift)}">${Number.isFinite(x.momentumShift)?(x.momentumShift>0?'+':'')+x.momentumShift.toFixed(1)+'pp':'—'}</div></div>
        <div class="mini"><div class="k">RSI</div><div class="v">${Number.isFinite(x.rsi14)?x.rsi14.toFixed(1):'—'}</div></div>
        <div class="mini"><div class="k">VOL 5D</div><div class="v">${Number.isFinite(x.max5Rvol)?fmt(x.max5Rvol)+'×':'—'}</div></div>
      </div>
      <div class="why"><strong>${x.watchStatus?'Current status':'Surfaced because'}</strong>${x.watchStatus?x.watchStatus:((x.why||[]).join(' · ')||'Saved chart')}</div>
      <div class="score"><small>tap details</small></div>
      ${inWatch?'<div class="remove-hint">Swipe left to remove</div>':''}
      <div class="detail"><div class="detail-grid">
        <div class="pill">60D<b class="${cls(x.ret60)}">${pct(x.ret60)}</b></div>
        <div class="pill">Pullback<b class="${cls(x.pullback)}">${pct(x.pullback)}</b></div>
        <div class="pill">Avg $ Vol<b>$${Number.isFinite(x.avgDollarVol)?(x.avgDollarVol/1e6).toFixed(1)+'M':'—'}</b></div>
        <div class="pill">vs 20D MA<b class="${cls(x.dist20)}">${pct(x.dist20)}</b></div>
        <div class="pill">vs 50D MA<b class="${cls(x.dist50)}">${pct(x.dist50)}</b></div>
        <div class="signal">Trend<b>${x.trendState||'—'}</b></div>
        <div class="signal">Momentum change<b class="${cls(x.momentumShift)}">${Number.isFinite(x.prev5)?`${pct(x.prev5)} → ${pct(x.ret5)}`:pct(x.momentumShift)}</b></div>
        <div class="signal">5D unusual activity<b class="${x.unusual5dDirection==='positive'?'up':x.unusual5dDirection==='negative'?'down':'flat'}">${x.unusual5dLabel||'—'}</b></div>
        <div class="signal">Relative vs ${x.benchmarkLabel||"TSX"}<b class="${cls(x.rs20)}">${pct(x.rs20)}</b></div><div class="signal">Relative vs sector<b class="${cls(x.sectorRs)}">${pct(x.sectorRs)}</b></div>
        <div class="signal">Sector strength<b class="${x.sectorStrength==='Strong'?'up':x.sectorStrength==='Weak'?'down':'flat'}">${x.sector||'—'} · ${x.sectorStrength||'—'}${Number.isFinite(x.sectorBreadth)?' · '+x.sectorBreadth+'% breadth':''}</b></div>
        <div class="signal">RSI 14<b>${Number.isFinite(x.rsi14)?x.rsi14.toFixed(1):'—'}</b></div>
        <div class="signal">Daily local high<b>${x.highState==='local_high_broken'?'Broken by close':x.highState==='failed_high_break'?'Failed / rejected break':x.highState==='local_high_intact'?'Intact':'—'}${Number.isFinite(x.localHigh)?' · '+fmt(x.localHigh):''}</b></div>
        <div class="signal">Daily local low<b>${x.lowState==='local_low_held'?'Held':x.lowState==='failed_low_break'?'Failed break · reclaimed':x.lowState==='local_low_broken'?'Broken by close':'—'}${Number.isFinite(x.localLow)?' · '+fmt(x.localLow):''}</b></div>
      </div></div>
    </article>`;
}

function render(){
  if(!state.data)return;
  renderMarket();renderTop5();renderChanges();renderHunter();renderWatchlist();renderCompareDock();
  const d=state.data;
  document.querySelector('#status').title=(d.failureDetails||[]).map(x=>`${x.symbol}: ${x.reason}`).join('\n');
  document.querySelector('#status').innerHTML=
    `<span class="dot"></span>${d.diagnostics?.liquid??d.breadth.scanned}/${d.universeSize} liquid · ${d.items.length} candidates · ${d.unavailable.length} unavailable${d.partial?" · Partial scan":""} · ${d.marketAsOf||""} · ${new Date(d.asOf).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
}

async function load(){
  state.expanded.clear();
  const app=document.querySelector('#app'),err=document.querySelector('#error');
  app.classList.add('loading');err.style.display='none';
  try{
    const min=document.querySelector('#liq').value;
    const [scanRes,historyRes]=await Promise.allSettled([
      fetch(`/api/scan?minDollar=${min}`,{cache:'no-store'}),
      fetch('/data/history.json',{cache:'no-store'})
    ]);
    if(scanRes.status!=='fulfilled') throw scanRes.reason;
    const r=scanRes.value;
    const j=await r.json();
    if(!r.ok)throw new Error(j.message||'Scan failed');
    state.data=j;
    if(historyRes.status==='fulfilled'&&historyRes.value.ok){
      try{state.history=await historyRes.value.json()}catch{state.history={snapshots:[]}}
    } else state.history={snapshots:[]};
    render();
  }catch(e){
    err.textContent=`Could not complete scan: ${e.message}`;
    err.style.display='block';
    document.querySelector('#status').textContent='Scan unavailable';
  }finally{app.classList.remove('loading')}
}

document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  state.tab=btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));
  document.querySelector('#marketView').classList.toggle('active',state.tab==='market');
  document.querySelector('#top5View').classList.toggle('active',state.tab==='top5');
  document.querySelector('#changesView').classList.toggle('active',state.tab==='changes');
  document.querySelector('#hunterView').classList.toggle('active',state.tab==='hunter');
  document.querySelector('#watchlistView').classList.toggle('active',state.tab==='watchlist');
}));
document.querySelector('#refresh').addEventListener('click',load);
document.querySelector('#liq').addEventListener('change',load);
document.querySelector('#topN').addEventListener('change',()=>{state.expanded.clear();renderHunter()});
load();
</script>
</body>
</html>
