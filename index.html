<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111d" id="themeColor">
  <script>
    try{
      const saved=localStorage.getItem('marketHunterTheme')||'dark';
      document.documentElement.dataset.theme=saved;
    }catch{document.documentElement.dataset.theme='dark'}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Market Hunter">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/market-hunter-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/mobile-polish.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/ui-polish.css">
  <link rel="stylesheet" href="/engine-dashboard.css">
  <link rel="stylesheet" href="/clean-ui.css">
  <title>Market Hunter</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brandmark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <strong>Market Hunter</strong>
          <small>Personal research desk</small>
        </div>
      </div>

      <nav class="side-nav" aria-label="Primary">
        <button class="navbtn active" aria-current="page" data-view="home"><span>⌂</span>Home</button>
        <button class="navbtn" data-view="shortlist"><span>◎</span>Charts to Review</button>
        <button class="navbtn" data-view="portfolio"><span>▣</span>Portfolio</button>
        <button class="navbtn" data-view="watchlist"><span>☆</span>Watchlist</button>
        <button class="navbtn" data-view="engines"><span>◈</span>Paper Engines</button>
      </nav>

      <div class="side-note">
        <span class="status-dot"></span>
        <div>
          <b>Research mode</b>
          <small>No buy/sell signals</small>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <div class="kicker">MARKET HUNTER</div>
          <h1 id="pageTitle">Market overview</h1>
          <p id="asOf">Loading market data…</p>
        </div>
        <div class="top-actions">
          <button class="btn" id="languageBtn" type="button">فارسی</button>
          <div class="market-status"><span></span><b>Market Hunter</b></div>
          <button class="iconbtn themebtn" id="themeBtn" aria-label="Switch theme" title="Switch theme">☼</button>
          <button class="iconbtn" id="refreshBtn" aria-label="Refresh data" title="Refresh">↻</button>
        </div>
      </header>

      <main class="main">
        <section class="view active" id="homeView"></section>
        <section class="view" id="shortlistView"></section>
        <section class="view" id="portfolioView"></section>
        <section class="view" id="watchlistView"></section>
        <section class="view" id="enginesView"></section>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobile primary">
    <button class="navbtn active" aria-current="page" data-view="home"><span>⌂</span><small>Home</small></button>
    <button class="navbtn" data-view="shortlist"><span>◎</span><small>Review</small></button>
    <button class="navbtn" data-view="portfolio"><span>▣</span><small>Portfolio</small></button>
    <button class="navbtn" data-view="watchlist"><span>☆</span><small>Watchlist</small></button>
    <button class="navbtn" data-view="engines"><span>◈</span><small>Engines</small></button>
  </nav>

  <input id="backupFile" type="file" accept="application/json,.json" hidden>
  <div class="modal" id="positionModal" aria-hidden="true"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <script src="/i18n.js" defer></script>
  <script src="/quote-policy.js" defer></script>
  <script src="/engine-dashboard.js" defer></script>
  <script src="/engine-matches.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
